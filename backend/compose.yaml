services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8080
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/actuator/health/readiness')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2

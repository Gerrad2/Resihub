server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: resihub-api
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 3000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER:https://clyksbctnzyreiujzinr.supabase.co/auth/v1}
resihub:
  allowed-origins: ${RESIHUB_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

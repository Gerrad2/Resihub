<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Listing Details | ResiHub Landlord</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="page-landlord-listing" data-resihub-surface="student">
    <div id="scrollProgress"></div>

    <!-- HEADER -->
    <div id="header"></div>

    <main>
        <!-- HERO -->
        <section class="ll-hero">
            <div class="container">
                <a href="my_listing.htm" class="ll-back"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> My
                    Listings</a>

                <div class="ll-hero-row">
                    <div>
                        <div id="propertyBadges" class="ll-badges"></div>
                        <h1 id="propertyTitle">Loading listing...</h1>
                        <p id="propertyLocation" class="ll-location"></p>
                    </div>

                    <div class="ll-actions">
                        <a id="inspectionBtn" href="edit_listing.htm" class="ll-primary">
                            <i class="fa-solid fa-pen" aria-hidden="true"></i> Edit listing
                        </a>
                        <a id="chatLandlordBtn" href="booking_requests.htm" class="ll-secondary">
                            <i class="fa-solid fa-calendar-check" aria-hidden="true"></i> View bookings
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <section class="ll-section">
            <div class="container ll-layout">

                <div class="ll-main">

                    <!-- GALLERY -->
                    <div class="ll-card">
                        <div id="propertyGallery" class="ll-gallery"></div>
                    </div>

                    <!-- KEY FACTS -->
                    <div class="ll-facts">
                        <article class="ll-fact">
                            <span>Price</span>
                            <strong id="propertyPrice">—</strong>
                        </article>
                        <article class="ll-fact">
                            <span>Type</span>
                            <strong id="propertyType">—</strong>
                        </article>
                        <article class="ll-fact">
                            <span>Bedrooms</span>
                            <strong id="bedroomCount">—</strong>
                        </article>
                        <article class="ll-fact">
                            <span>Bathrooms</span>
                            <strong id="bathroomCount">—</strong>
                        </article>
                        <article class="ll-fact">
                            <span>Rooms available</span>
                            <strong id="propertySize">—</strong>
                        </article>
                    </div>

                    <!-- DESCRIPTION -->
                    <div class="ll-card">
                        <h2>About this property</h2>
                        <p id="propertyDescription" class="ll-text">—</p>
                    </div>

                    <!-- AMENITIES AND DETAILS -->
                    <div class="ll-two">
                        <div class="ll-card">
                            <h2>Amenities</h2>
                            <ul id="amenitiesGrid" class="ll-list"></ul>
                        </div>
                        <div class="ll-card">
                            <h2>Details</h2>
                            <ul id="featuresGrid" class="ll-list"></ul>
                        </div>
                    </div>

                    <!-- BOOKINGS -->
                    <div class="ll-card">
                        <div class="ll-head">
                            <h2>Recent bookings</h2>
                            <a href="booking_requests.htm">View all</a>
                        </div>
                        <div id="listingBookings" class="ll-rows"></div>
                    </div>

                    <!-- REVIEWS -->
                    <div class="ll-card">
                        <h2>Reviews</h2>
                        <div id="reviewList" class="ll-rows"></div>
                    </div>

                </div>

                <!-- SIDE -->
                <aside class="ll-side">
                    <div class="ll-card ll-owner">
                        <img id="landlordPhoto" src="../assets/images/default-avatar.png" alt="Your photo">
                        <h3 id="landlordName">You</h3>
                        <p id="landlordJoined"></p>
                    </div>

                    <div class="ll-card">
                        <h2>Your other listings</h2>
                        <div id="similarListings" class="ll-rows"></div>
                    </div>
                </aside>

            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
    <script type="module">
        import { init } from "../js/listing_details.js";
        init();
    </script>
</body>

</html>

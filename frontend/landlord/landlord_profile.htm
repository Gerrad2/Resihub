<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Landlord Profile | ResiHub</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="page-profile page-landlord-profile" data-resihub-surface="student">
    <div id="scrollProgress"></div>

    <!-- HEADER -->
    <div id="header"></div>

    <main>
        <!-- BANNER AND IDENTITY -->
        <section class="pf-hero">
            <div class="pf-banner" aria-hidden="true"></div>

            <div class="container pf-identity">
                <img id="landlordAvatar" class="pf-avatar" src="../assets/images/default-avatar.png"
                    alt="Your profile photo">

                <div class="pf-identity-text">
                    <div class="pf-name-row">
                        <h1 id="landlordName">Landlord</h1>
                        <span id="verifiedBadge" class="pf-pill">Landlord</span>
                    </div>
                    <p id="businessNameDisplay" class="pf-uni">Landlord on ResiHub</p>

                    <div class="pf-actions">
                        <a href="edit_landlord_profile.htm" class="pf-primary">
                            <i class="fa-solid fa-pen" aria-hidden="true"></i> Edit Profile
                        </a>
                        <a href="landlord_settings.htm" class="pf-secondary">
                            <i class="fa-solid fa-gear" aria-hidden="true"></i> Settings
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <!-- QUICK STATS -->
        <section class="pf-stats-section">
            <div class="container pf-stats">
                <article class="pf-stat">
                    <strong id="profileListings">—</strong>
                    <span>Listings</span>
                </article>
                <article class="pf-stat">
                    <strong id="profileBookings">—</strong>
                    <span>Bookings</span>
                </article>
                <article class="pf-stat">
                    <strong id="profileRating">—</strong>
                    <span>Average Rating</span>
                </article>
            </div>
        </section>

        <!-- DETAILS -->
        <section class="pf-details">
            <div class="container pf-grid">

                <div class="pf-card">
                    <h2>Business Information</h2>
                    <dl>
                        <div>
                            <dt>Business Name</dt>
                            <dd id="businessName">—</dd>
                        </div>
                        <div>
                            <dt>About the Business</dt>
                            <dd id="businessDescription">—</dd>
                        </div>
                        <div>
                            <dt>CAC Registration Number</dt>
                            <dd id="cacNumber">—</dd>
                        </div>
                        <div>
                            <dt>NIN</dt>
                            <dd id="ninDisplay">—</dd>
                        </div>
                    </dl>
                </div>

                <div class="pf-card">
                    <h2>Personal Information</h2>
                    <dl>
                        <div>
                            <dt>Full Name</dt>
                            <dd id="fullName">—</dd>
                        </div>
                        <div>
                            <dt>Email</dt>
                            <dd><span id="email">—</span> <small id="emailStatus"></small></dd>
                        </div>
                        <div>
                            <dt>Phone Number</dt>
                            <dd><span id="phone">—</span> <small id="phoneStatus"></small></dd>
                        </div>
                        <div>
                            <dt>Gender</dt>
                            <dd id="gender">—</dd>
                        </div>
                        <div>
                            <dt>Date of Birth</dt>
                            <dd id="dateOfBirth">—</dd>
                        </div>
                        <div>
                            <dt>State</dt>
                            <dd id="state">—</dd>
                        </div>
                        <div>
                            <dt>Member Since</dt>
                            <dd id="memberSince">—</dd>
                        </div>
                    </dl>
                </div>

            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
    <script type="module">
        import { init } from "../js/landlord_profile.js";
        init();
    </script>
</body>

</html>

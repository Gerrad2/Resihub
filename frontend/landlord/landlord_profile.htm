<body>
    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <div id="header"></div>

    <main>
        <section class="dashboard-hero">
            <div class="container">
                <div class="dashboard-welcome">
                    <img id="landlordAvatar" src="../assets/images/default-avatar.png" alt="Landlord Profile Picture">

                    <div>
                        <h1 id="landlordName">
                            Landlord Name

                            <span class="status-badge verified">
                                Verified
                            </span>

                            <span class="status-badge pending">
                                Pending
                            </span>
                        </h1>

                        <p id="businessNameDisplay">
                            Business Name
                        </p>
                    </div>
                </div>
            </div>
        </section>
        <section class="profile-section">
            <div class="container">
                <div class="profile-card">

                    <div class="section-header">
                        <h2>Personal Information</h2>
                    </div>

                    <div class="profile-grid">

                        <div class="profile-item">
                            <label>Full Name</label>
                            <p id="fullName"></p>
                        </div>

                        <div class="profile-item">
                            <label>Email Address</label>
                            <p id="email"></p>
                        </div>

                        <div class="profile-item">
                            <label>Phone Number</label>
                            <p id="phone"></p>
                        </div>

                        <div class="profile-item">
                            <label>Gender</label>
                            <p id="gender"></p>
                        </div>

                        <div class="profile-item">
                            <label>Date of Birth</label>
                            <p id="dateOfBirth"></p>
                        </div>

                        <div class="profile-item">
                            <label>State</label>
                            <p id="state"></p>
                        </div>

                    </div>

                </div>
            </div>
        </section>
        <section class="profile-section">
            <div class="container">

                <div class="profile-card">

                    <div class="section-header">
                        <h2>Business Information</h2>
                    </div>

                    <div class="profile-grid">

                        <div class="form-group">
                            <label for="businessName">
                                Business Name
                            </label>

                            <textarea type="text" id="businessName" placeholder="Business Name" readonly></textarea>
                        </div>

                        <div class="form-group">
                            <label for="businessDescription">
                                Business Description
                            </label>

                            <textarea id="businessDescription" rows="4" readonly></textarea>
                        </div>

                        <div class="form-group">
                            <label for="cacNumber">
                                CAC Registration Number
                            </label>

                            <textarea id="cacNumber" placeholder="CAC Number" readonly></textarea>
                        </div>

                    </div>

                </div>

            </div>
        </section>
        <section class="profile-section">
            <div class="container">
                <div class="profile-card">
                    <h2>Account Status</h2>
                    <div class="profile-grid">
                        <div class="profile-item">
                            <label>Email Verification</label>
                            <p id="emailStatus"></p>
                        </div>
                        <div class="profile-item">
                            <label>Phone Verification</label>
                            <p id="phoneStatus"></p>
                        </div>
                        <div class="profile-item">
                            <label>Member Since</label>
                            <p id="memberSince"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="profile-actions">
            <div class="container">

                <a href="../landlord/edit_landlord_profile.htm" class="btn-primary">
                    <i class="fa-solid fa-pen"></i>
                    Edit Profile
                </a>

                <a href="../landlord/dashboard_landlord.htm" class="btn-primary magnetic-btn ripple-btn shine-btn">
                    <i class="fa-solid fa-table-columns"></i>
                    Back to Dashboard
                </a>

            </div>
        </section>
    </main>
    <!--FOOTER-->

    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>

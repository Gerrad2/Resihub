<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Landlord Profile | ResiHub</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="page-edit-profile page-landlord-edit-profile" data-resihub-surface="student">
    <div id="scrollProgress"></div>

    <!-- HEADER -->
    <div id="header"></div>

    <main>
        <section class="ep-hero">
            <div class="container">
                <span class="ep-badge"><i class="fa-solid fa-user-pen" aria-hidden="true"></i>Profile</span>
                <h1>Edit landlord profile</h1>
                <p>Keep your business and contact details up to date.</p>
            </div>
        </section>

        <section class="ep-section">
            <div class="container">
                <form id="landlordProfileForm" class="ep-layout" novalidate>

                    <!-- PHOTO -->
                    <aside class="ep-card ep-photo-card">
                        <div class="ep-avatar-ring">
                            <img id="profilePreview" src="../assets/images/default-avatar.png"
                                alt="Profile photo preview">
                        </div>

                        <label class="ep-photo-btn" for="profileImage">
                            <i class="fa-solid fa-camera" aria-hidden="true"></i> Change Photo
                        </label>
                        <input type="file" id="profileImage" accept="image/jpeg,image/png,image/webp" hidden>

                        <p class="ep-hint">JPG, PNG or WebP, up to 5 MB.</p>
                    </aside>

                    <div class="ep-main">

                        <!-- PERSONAL -->
                        <div class="ep-card">
                            <h2>Personal Information</h2>

                            <div class="ep-grid">
                                <div class="ep-field">
                                    <label for="fullName">Full Name</label>
                                    <input type="text" id="fullName" autocomplete="name" required>
                                </div>

                                <div class="ep-field">
                                    <label for="email">Email Address</label>
                                    <input type="email" id="email" readonly>
                                </div>

                                <div class="ep-field">
                                    <label for="phone">Phone Number</label>
                                    <input type="tel" id="phone" autocomplete="tel">
                                </div>

                                <div class="ep-field">
                                    <label for="gender">Gender</label>
                                    <select id="gender">
                                        <option value="">Select</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>

                                <div class="ep-field ep-full">
                                    <label for="dob">Date of Birth</label>
                                    <input type="date" id="dob">
                                </div>
                            </div>
                        </div>

                        <!-- BUSINESS -->
                        <div class="ep-card">
                            <h2>Business Information</h2>

                            <div class="ep-grid">
                                <div class="ep-field">
                                    <label for="businessName">Business Name</label>
                                    <input type="text" id="businessName" maxlength="120"
                                        placeholder="e.g. Johnson Properties">
                                </div>

                                <div class="ep-field">
                                    <label for="nin">NIN (11 digits)</label>
                                    <input type="text" id="nin" inputmode="numeric" maxlength="11"
                                        placeholder="Enter your 11-digit NIN">
                                    <p class="ep-hint">Kept private. Only used to verify your business.</p>
                                </div>

                                <div class="ep-field">
                                    <label for="cacNumber">CAC Registration Number</label>
                                    <input type="text" id="cacNumber" maxlength="40" placeholder="e.g. RC1234567">
                                    <p class="ep-hint">Optional. Add your CAC number if your business is registered.</p>
                                </div>

                                <div class="ep-field ep-full">
                                    <label for="address">Address (must match your proof of address)</label>
                                    <input type="text" id="address" maxlength="200"
                                        placeholder="House number, street, area, city, state">
                                </div>

                                <div class="ep-field ep-full">
                                    <label for="businessDescription">About Your Business</label>
                                    <textarea id="businessDescription" rows="4" maxlength="1000"
                                        placeholder="Tell students what you offer and how you manage your properties."></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- EMERGENCY -->
                        <div class="ep-card">
                            <h2>Emergency Contact</h2>

                            <div class="ep-grid">
                                <div class="ep-field">
                                    <label for="emergencyName">Contact Name</label>
                                    <input type="text" id="emergencyName">
                                </div>

                                <div class="ep-field">
                                    <label for="emergencyRelationship">Relationship</label>
                                    <input type="text" id="emergencyRelationship" placeholder="e.g. Business partner">
                                </div>

                                <div class="ep-field ep-full">
                                    <label for="emergencyPhone">Contact Phone</label>
                                    <input type="tel" id="emergencyPhone">
                                </div>
                            </div>
                        </div>

                        <p id="landlordProfileMessage" class="ep-hint" role="status"></p>

                        <!-- ACTIONS -->
                        <div class="ep-actions">
                            <a href="landlord_profile.htm" id="cancelEditBtn" class="ep-secondary">Cancel</a>
                            <button type="submit" id="saveProfileBtn" class="ep-primary">
                                <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save Changes
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
    <script type="module">
        import { init } from "../js/landlord_Profile_edit.js";
        init();
    </script>
</body>

</html>

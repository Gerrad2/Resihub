<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Landlord Profile | ResiHub</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <meta name="description"
        content="Edit your ResiHub landlord profile, business details, emergency contact and account information.">

    <meta name="keywords"
        content="ResiHub landlord profile, edit landlord account, business profile, student accommodation Nigeria">

    <meta name="author" content="ResiHub">
</head>

<body data-resihub-surface="landlord">
    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <div id="header"></div>

    <main>
        <section class="profile-settings-section">

            <div class="container">
                <section class="page-hero">

                    <div class="container">

                        <section class="auth-hero reveal fade-up">

                            <span class="page-badge floating-badge">

                                <i class="fa-solid fa-user-pen"></i>

                                Profile Settings

                            </span>

                            <h1>

                                Edit Your Landlord Profile

                            </h1>

                            <p>

                                Keep your personal information, business details,
                                emergency contact and profile photo up to date.

                            </p>

                        </section>

                    </div>

                </section>
                <div class="profile-photo-card">

                    <div class="profile-photo">

                        <img id="profilePreview" src="../assets/images/default-avatar.png" alt="Landlord Profile Photo">

                    </div>

                    <h3>Your Profile Photo</h3>

                    <p>

                        Upload a clear photo to help students recognize you.

                    </p>

                    <label for="profileImage" class="btn-outline">

                        <i class="fa-solid fa-camera"></i>

                        Change Photo

                    </label>

                    <input type="file" id="profileImage" accept="image/*" hidden>

                </div>
                <div class="profile-card">
                    <h2>
                        <i class="fa-solid fa-user"></i>
                        Personal Information
                    </h2>
                    <div class="profile-grid">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" readonly>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone">
                        </div>
                        <div class="form-group">
                            <label for="gender">Gender</label>
                            <select id="gender">
                                <option value="">Select</option>
                                <option>Male</option>
                                <option>Female</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="dob">Date of Birth</label>
                            <input type="date" id="dob">
                        </div>
                    </div>
                </div>
                <div class="profile-card">

                    <h2>
                        <i class="fa-solid fa-building"></i>
                        Business Information
                    </h2>

                    <div class="profile-grid">

                        <div class="form-group">
                            <label for="businessName">Business Name</label>
                            <input type="text" id="businessName" placeholder="Business Name">
                        </div>

                        <div class="form-group">
                            <label for="cacNumber">CAC Registration Number</label>
                            <input type="text" id="cacNumber" placeholder="CAC Number">
                        </div>

                        <div class="form-group full-width">
                            <label for="businessDescription">Business Description</label>
                            <textarea id="businessDescription" rows="5" placeholder="Describe your business"></textarea>
                        </div>

                    </div>

                </div>
                <div class="profile-card">
                    <h2>
                        <i class="fa-solid fa-phone"></i>
                        Emergency Contact
                    </h2>
                    <div class="profile-grid">
                        <div class="form-group">
                            <label for="emergencyName">Full Name</label>
                            <input type="text" id="emergencyName">
                        </div>
                        <div class="form-group">
                            <label for="emergencyRelationship">Relationship</label>
                            <input type="text" id="emergencyRelationship">
                        </div>
                        <div class="form-group">
                            <label for="emergencyPhone">Phone</label>
                            <input type="tel" id="emergencyPhone">
                        </div>
                    </div>
                </div>
                <div class="profile-actions-card">

                    <button id="cancelEditBtn" class="btn-outline">

                        Cancel

                    </button>

                    <button id="saveProfileBtn" class="btn-primary magnetic-btn ripple-btn shine-btn">

                        <i class="fa-solid fa-floppy-disk"></i>

                        Save Changes

                    </button>

                </div>
            </div>

        </section>
    </main>
    <!--FOOTER-->

    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

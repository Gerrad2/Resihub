<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Listing | ResiHub Landlord</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="page-edit-listing" data-resihub-surface="student">
    <div id="scrollProgress"></div>

    <!-- HEADER -->
    <div id="header"></div>

    <main>
        <section id="edit-listing-hero" class="el-hero">
            <div class="container">
                <span class="el-badge"><i class="fa-solid fa-pen" aria-hidden="true"></i>Edit listing</span>
                <h1>Edit property</h1>
                <p>Update the details, amenities and photos. Students see changes as soon as you save.</p>
            </div>
        </section>

        <section class="el-section">
            <div class="container">
                <form id="editListingForm" class="el-form" novalidate>
                    <input type="hidden" id="listingId">

                    <!-- BASIC INFORMATION -->
                    <div class="el-card">
                        <h2>Basic information</h2>
                        <div class="el-grid">
                            <div class="el-field el-full">
                                <label for="propertyTitle">Property title</label>
                                <input id="propertyTitle" maxlength="120" required>
                            </div>

                            <div class="el-field">
                                <label for="propertyType">Property type</label>
                                <select id="propertyType" required>
                                    <option value="">Choose a type</option>
                                    <option value="self-contain">Self Contain</option>
                                    <option value="single-room">Single Room</option>
                                    <option value="shared-room">Shared Room</option>
                                    <option value="1-bedroom">1 Bedroom</option>
                                    <option value="2-bedroom">2 Bedroom</option>
                                    <option value="3-bedroom">3 Bedroom</option>
                                    <option value="apartment">Apartment</option>
                                    <option value="hostel">Hostel</option>
                                </select>
                            </div>

                            <div class="el-field">
                                <label for="propertyUniversity">University</label>
                                <select id="propertyUniversity">
                                    <option value="">Choose a university</option>
                                </select>
                            </div>

                            <div class="el-field">
                                <label for="propertyArea">Area</label>
                                <input id="propertyArea" required>
                            </div>

                            <div class="el-field">
                                <label for="propertyAddress">Full address</label>
                                <input id="propertyAddress">
                            </div>

                            <div class="el-field">
                                <label for="propertyPrice">Price per month (₦)</label>
                                <input id="propertyPrice" type="number" min="0" step="1" required>
                            </div>

                            <div class="el-field">
                                <label for="availableRooms">Rooms available</label>
                                <input id="availableRooms" type="number" min="0" step="1">
                            </div>

                            <div class="el-field el-full">
                                <label for="listingAvailability">Availability</label>
                                <select id="listingAvailability">
                                    <option value="available">Available</option>
                                    <option value="unavailable">Unavailable</option>
                                    <option value="booked">Booked</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- DESCRIPTION -->
                    <div class="el-card">
                        <h2>Description</h2>
                        <div class="el-field">
                            <label for="propertyDescription">Describe the property</label>
                            <textarea id="propertyDescription" rows="6" maxlength="2000"
                                placeholder="What makes this place a good home for students?"></textarea>
                        </div>
                    </div>

                    <!-- AMENITIES -->
                    <div class="el-card">
                        <h2>Amenities</h2>
                        <div class="el-amenities">
                            <label class="el-check"><input type="checkbox" id="wifiAmenity"><span>Wi-Fi</span></label>
                            <label class="el-check"><input type="checkbox" id="waterAmenity"><span>Running
                                    water</span></label>
                            <label class="el-check"><input type="checkbox" id="electricityAmenity"><span>Stable
                                    electricity</span></label>
                            <label class="el-check"><input type="checkbox"
                                    id="securityAmenity"><span>Security</span></label>
                            <label class="el-check"><input type="checkbox"
                                    id="parkingAmenity"><span>Parking</span></label>
                            <label class="el-check"><input type="checkbox"
                                    id="furnishedAmenity"><span>Furnished</span></label>
                            <label class="el-check"><input type="checkbox"
                                    id="kitchenAmenity"><span>Kitchen</span></label>
                            <label class="el-check"><input type="checkbox" id="bathroomAmenity"><span>Private
                                    bathroom</span></label>
                        </div>
                    </div>

                    <!-- PHOTOS -->
                    <div class="el-card">
                        <h2>Photos</h2>
                        <p class="el-hint">Add at least three photos before publishing. The first photo is the cover. Up
                            to 10 photos, JPG, PNG or WebP, 10 MB each.</p>

                        <label id="imageUploadZone" class="el-drop" for="propertyImages">
                            <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
                            <span>Choose photos to add</span>
                        </label>
                        <input type="file" id="propertyImages" accept="image/jpeg,image/png,image/webp" multiple hidden>

                        <div id="imagePreview" class="el-photos"></div>
                    </div>

                    <p id="editListingMessage" class="el-message" role="status"></p>

                    <!-- ACTIONS -->
                    <div class="el-actions">
                        <button type="button" id="deleteListingBtn" class="el-danger">
                            <i class="fa-solid fa-trash" aria-hidden="true"></i> Delete listing
                        </button>

                        <span class="el-spacer"></span>

                        <button type="submit" id="updateListingBtn" class="el-secondary">
                            <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save changes
                        </button>

                        <button type="button" id="publishListingBtn" class="el-primary">
                            <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Publish
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
    <script type="module">
        import { init } from "../js/editing_listing.js";
        init();
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Manage your ResiHub account settings, notifications, security preferences and account options.">

    <meta name="keywords"
        content="ResiHub settings, student settings, account settings, notifications, security, student housing">

    <meta name="author" content="ResiHub">

    <meta name="theme-color" content="#0F766E">

    <title>Student Settings | ResiHub</title>

    <!-- Favicon -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main Stylesheet -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body>
    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>
    <!-- HEADER / NAVIGATION-->

    <div id="header"></div>

    <main>

        <section class="page-hero">

            <div class="container">

                <section class="auth-hero reveal fade-up">

                    <span class="page-badge floating-badge">

                        <i class="fa-solid fa-gear" aria-hidden="true"></i>

                        Settings

                    </span>

                    <h1>

                        Account Settings

                    </h1>

                    <p>

                        Manage your account preferences, notifications and security from one place.

                    </p>

                </section>

            </div>

        </section>

        <section class="settings-page">

            <div class="container">

                <form id="settingsForm">

                    <div class="settings-card">

                        <h2>Preferences</h2>

                        <label>

                            <input type="checkbox" id="emailNotifications">

                            Email Notifications

                        </label>

                        <label>

                            <input type="checkbox" id="smsNotifications">

                            SMS Notifications

                        </label>

                        <label>

                            <input type="checkbox" id="darkMode">

                            Dark Mode

                        </label>

                    </div>

                    <div class="settings-card">

                        <h2>Security</h2>

                        <p>

                            Keep your account secure by updating your password regularly.

                        </p>

                        <a href="../auth/reset_password.htm" class="btn-outline">

                            Change Password

                        </a>

                    </div>

                    <button type="submit" id="saveSettingsBtn" class="btn-primary">

                        <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>

                        Save Settings

                    </button>

                </form>

            </div>

        </section>

    </main>
    <!-- FOOTER -->

    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

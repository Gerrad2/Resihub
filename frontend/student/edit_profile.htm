<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student Profile | ResiHub</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="page-edit-profile" data-resihub-surface="student">
    <div id="scrollProgress"></div>

    <!-- HEADER -->
    <div id="header"></div>

    <main>
        <!-- HERO -->
        <section class="ep-hero">
            <div class="container">
                <span class="ep-badge"><i class="fa-solid fa-user-pen" aria-hidden="true"></i>Profile</span>
                <h1>Edit Profile</h1>
                <p>Keep your personal information up to date.</p>
            </div>
        </section>

        <!-- FORM -->
        <section class="ep-section">
            <div class="container">
                <form id="editProfileForm" class="ep-layout" novalidate>

                    <!-- PHOTO -->
                    <aside class="ep-card ep-photo-card">
                        <div class="ep-avatar-ring">
                            <img id="profilePreview" src="../assets/images/default-avatar.png"
                                alt="Profile photo preview">
                        </div>

                        <label class="ep-photo-btn" for="profileImage">
                            <i class="fa-solid fa-camera" aria-hidden="true"></i> Change Photo
                        </label>
                        <input type="file" id="profileImage" accept="image/jpeg,image/png,image/webp" hidden>

                        <p class="ep-hint">JPG, PNG or WebP, up to 5 MB.</p>
                    </aside>

                    <div class="ep-main">

                        <!-- PERSONAL -->
                        <div class="ep-card">
                            <h2>Personal Information</h2>

                            <div class="ep-grid">
                                <div class="ep-field">
                                    <label for="fullName">Full Name</label>
                                    <input type="text" id="fullName" autocomplete="name" required>
                                </div>

                                <div class="ep-field">
                                    <label for="email">Email Address</label>
                                    <input type="email" id="email" readonly>
                                </div>

                                <div class="ep-field">
                                    <label for="phone">Phone Number</label>
                                    <input type="tel" id="phone" autocomplete="tel">
                                </div>

                                <div class="ep-field">
                                    <label for="gender">Gender</label>
                                    <select id="gender">
                                        <option value="">Select</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>

                                <div class="ep-field">
                                    <label for="dob">Date of Birth</label>
                                    <input type="date" id="dob">
                                </div>

                                <div class="ep-field">
                                    <label for="university">University</label>
                                    <select id="university">
                                        <option value="">Select university</option>
                                    </select>
                                </div>

                                <div class="ep-field">
                                    <label for="faculty">Faculty</label>
                                    <input type="text" id="faculty">
                                </div>

                                <div class="ep-field">
                                    <label for="department">Department</label>
                                    <input type="text" id="department">
                                </div>

                                <div class="ep-field">
                                    <label for="level">Level</label>
                                    <select id="level">
                                        <option value="">Select</option>
                                        <option value="100">100 Level</option>
                                        <option value="200">200 Level</option>
                                        <option value="300">300 Level</option>
                                        <option value="400">400 Level</option>
                                        <option value="500">500 Level</option>
                                    </select>
                                </div>

                                <div class="ep-field">
                                    <label for="matricNumber">Matric Number</label>
                                    <input type="text" id="matricNumber">
                                </div>

                                <div class="ep-field">
                                    <label for="state">State</label>
                                    <input type="text" id="state" placeholder="e.g. Lagos">
                                </div>
                            </div>
                        </div>

                        <!-- EMERGENCY -->
                        <div class="ep-card">
                            <h2>Emergency Contact</h2>

                            <div class="ep-grid">
                                <div class="ep-field">
                                    <label for="emergencyName">Contact Name</label>
                                    <input type="text" id="emergencyName">
                                </div>

                                <div class="ep-field">
                                    <label for="emergencyRelationship">Relationship</label>
                                    <input type="text" id="emergencyRelationship" placeholder="e.g. Parent">
                                </div>

                                <div class="ep-field ep-full">
                                    <label for="emergencyPhone">Contact Phone</label>
                                    <input type="tel" id="emergencyPhone">
                                </div>
                            </div>
                        </div>

                        <!-- ACTIONS -->
                        <div class="ep-actions">
                            <a href="../student/profile.htm" id="cancelEditBtn" class="ep-secondary">Cancel</a>
                            <button type="submit" id="saveProfileBtn" class="ep-primary">
                                <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save Changes
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
    <script type="module">
        import { init } from "../js/edit_profile.js";
        init();
    </script>
</body>

</html>

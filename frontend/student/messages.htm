<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Messages | ResiHub Nigeria</title>

    <meta name="description"
        content="Securely chat with landlords on ResiHub. Send messages, receive replies, discuss inspections, accommodation availability and manage all your student housing conversations across Nigeria.">

    <meta name="keywords"
        content="student messages, landlord chat, ResiHub messaging, accommodation chat Nigeria, student accommodation messages, hostel enquiries, property messaging, landlord conversations">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="index, follow">

    <meta name="theme-color" content="#0B6E4F">

    <meta name="application-name" content="ResiHub">

    <meta name="apple-mobile-web-app-title" content="ResiHub">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="mobile-web-app-capable" content="yes">

    <meta name="format-detection" content="telephone=no">

    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- Open Graph -->

    <meta property="og:site_name" content="ResiHub">

    <meta property="og:title" content="Student Messages | ResiHub Nigeria">

    <meta property="og:description"
        content="Chat securely with verified landlords, discuss accommodation details and manage your conversations on ResiHub.">

    <meta property="og:type" content="website">

    <meta property="og:url" content="https://www.resihub.com/student_messages.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.png">

    <meta property="og:image:alt" content="Student Messages on ResiHub">

    <meta property="og:locale" content="en_NG">

    <!-- Twitter -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Student Messages | ResiHub Nigeria">

    <meta name="twitter:description" content="Secure messaging between students and landlords on ResiHub.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.png">

    <!-- Canonical -->

    <link rel="canonical" href="https://www.resihub.com/student_messages.htm">

    <!-- Favicon -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main Stylesheet -->

    <link rel="stylesheet" href="../styles/style.css">
    <!-- Structured Data -->

    <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"WebPage",
      "name":"Student Messages",
      "url":"https://www.resihub.com/student_messages.htm",
      "description":"Secure messaging system that allows students to communicate with landlords about accommodation, inspections and bookings on ResiHub.",
      "publisher":{
        "@type":"Organization",
        "name":"ResiHub",
        "logo":{
          "@type":"ImageObject",
          "url":"https://www.resihub.com/assets/images/logo.png"
        }
      }
    }
    </script>

</head>

<body data-resihub-surface="student">
    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>
    <!-- HEADER / NAVIGATION-->

    <div id="header"></div>

    <main>

        <!-- Hero Section -->
        <section class="page-hero">

            <div class="container">

                <header id="messages-hero" class="auth-hero reveal fade-up">

                    <span class="page-badge floating-badge">

                        <i class="fa-solid fa-comments" aria-hidden="true"></i>

                        Messages

                    </span>

                    <h2>Your Conversations</h2>

                    <p>
                        Chat securely with verified landlords through ResiHub.
                    </p>

                </header>

            </div>

        </section>

        <!-- Messaging System -->
        <section class="messages-page">

            <div class="container">

                <div class="messages-layout">

                    <!-- Conversation Sidebar -->
                    <aside class="conversation-sidebar">

                        <div class="chat-search">

                            <label for="conversationSearch" class="visually-hidden">

                                Search Conversations

                            </label>

                            <input type="search" id="conversationSearch" name="conversationSearch"
                                placeholder="Search conversations..." autocomplete="off">

                        </div>

                        <div id="conversationList" class="conversation-list" aria-live="polite">

                        </div>

                    </aside>

                    <!-- Chat Area -->
                    <section class="chat-area">

                        <!-- Chat Header -->

                        <header class="chat-header">

                            <img id="chatAvatar" src="../assets/images/default-avatar.png" alt="Landlord Profile Picture">

                            <div>

                                <h2 id="chatName">

                                    Select a Conversation

                                </h2>

                                <p id="chatStatus">

                                </p>

                            </div>

                        </header>

                        <!-- Messages -->

                        <div id="chatMessages" class="chat-messages" aria-live="polite">

                        </div>

                        <!-- Empty State -->

                        <div id="emptyChat" class="empty-state">

                            <i class="fa-solid fa-comments" aria-hidden="true"></i>

                            <h3>Select a Conversation</h3>

                            <p>

                                Choose a conversation to begin chatting with a landlord.

                            </p>

                        </div>

                        <!-- Message Form -->

                        <form id="messageForm" autocomplete="off">

                            <label for="messageInput" class="visually-hidden">

                                Type your message

                            </label>

                            <input type="text" id="messageInput" name="message" placeholder="Type your message..."
                                autocomplete="off" required>

                            <button type="submit" id="sendMessage" aria-label="Send Message">

                                <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>

                            </button>

                        </form>

                    </section>

                </div>

            </div>

        </section>

    </main>
    <!--FOOTER-->

    <div id="footer"></div>

    <!-- Page Script -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

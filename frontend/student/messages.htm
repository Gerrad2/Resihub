<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Messages | ResiHub</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="page-messages" data-resihub-surface="student">
    <div id="scrollProgress"></div>

    <!-- HEADER -->
    <div id="header"></div>

    <main>
        <!-- HERO -->
        <section id="messages-hero" class="msg-hero">
            <div class="container">
                <span class="msg-badge"><i class="fa-solid fa-comments" aria-hidden="true"></i>Messages</span>
                <h1>Messages</h1>
                <p class="msg-sub">Chat with landlords, support and other students.</p>
            </div>
        </section>

        <section class="msg-section">
            <div class="container msg-layout">

                <!-- CONVERSATIONS -->
                <aside class="msg-sidebar">
                    <div class="msg-panel msg-panel-grow">
                        <h3 class="msg-panel-title">Conversations</h3>

                        <div class="msg-search">
                            <label class="visually-hidden" for="conversationSearch">Search conversations</label>
                            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                            <input type="search" id="conversationSearch" placeholder="Search conversations..."
                                autocomplete="off">
                        </div>

                        <div id="conversationList" class="msg-conversations" aria-label="Conversations"></div>
                    </div>
                </aside>

                <!-- CHAT -->
                <section class="msg-chat">
                    <header class="msg-chat-head">
                        <img id="chatAvatar" src="../assets/images/default-avatar.png" alt="">
                        <div>
                            <h2 id="chatName">Select a conversation</h2>
                            <p id="chatStatus"></p>
                        </div>
                        <div id="chatActions" class="msg-actions"></div>
                    </header>

                    <div class="msg-body">
                        <div id="emptyChat" class="msg-empty">
                            <i class="fa-solid fa-comments" aria-hidden="true"></i>
                            <h3>Select a conversation</h3>
                            <p>Choose a conversation to start chatting.</p>
                        </div>

                        <div id="chatMessages" class="msg-thread hidden" aria-live="polite"></div>
                    </div>

                    <form id="messageForm" class="msg-form" autocomplete="off">
                        <label class="visually-hidden" for="messageInput">Type your message</label>
                        <input type="text" id="messageInput" placeholder="Type your message..." maxlength="1000"
                            disabled>
                        <button type="submit" id="sendMessage" aria-label="Send message" disabled>
                            <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                        </button>
                    </form>
                </section>

            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
    <script type="module">
        import { init } from "../js/messages.js";
        init();
    </script>
</body>

</html>

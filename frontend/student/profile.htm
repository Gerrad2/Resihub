<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile | ResiHub Nigeria</title>

    <meta name="description"
        content="View and manage your student profile on ResiHub. Update your personal information, academic details, emergency contacts and account verification status.">

    <meta name="keywords"
        content="ResiHub student profile, student account, profile management, university student accommodation Nigeria, student dashboard, hostel platform Nigeria">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="index, follow">

    <meta name="theme-color" content="#0B6E4F">

    <meta name="application-name" content="ResiHub">

    <meta name="apple-mobile-web-app-title" content="ResiHub">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="mobile-web-app-capable" content="yes">

    <meta name="format-detection" content="telephone=no">

    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- Open Graph -->

    <meta property="og:site_name" content="ResiHub">

    <meta property="og:title" content="Student Profile | ResiHub Nigeria">

    <meta property="og:description"
        content="Manage your ResiHub student profile, academic information, emergency contacts and account settings from one secure dashboard.">

    <meta property="og:type" content="website">

    <meta property="og:url" content="https://www.resihub.com/student_profile.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.png">

    <meta property="og:image:alt" content="ResiHub Student Profile">

    <meta property="og:locale" content="en_NG">

    <!-- Twitter -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Student Profile | ResiHub Nigeria">

    <meta name="twitter:description"
        content="Access and manage your ResiHub student profile, personal details and academic information.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.png">

    <!-- Canonical -->

    <link rel="canonical" href="https://www.resihub.com/student_profile.htm">

    <!-- Favicon -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main Stylesheet -->

    <link rel="stylesheet" href="../styles/style.css">

    <!-- Structured Data -->

    <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"ProfilePage",
      "name":"Student Profile",
      "url":"https://www.resihub.com/student_profile.htm",
      "description":"Student profile page for managing personal, academic and account information on ResiHub.",
      "publisher":{
        "@type":"Organization",
        "name":"ResiHub",
        "logo":{
          "@type":"ImageObject",
          "url":"https://www.resihub.com/assets/images/logo.png"
        }
      }
    }
    </script>

</head>

<body>
    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>
    <!-- HEADER / NAVIGATION-->

    <div id="header"></div>

    <main>

        <!-- Hero -->

        <section class="page-hero">

            <div class="container">

                <header id="student-profile-hero" class="auth-hero reveal fade-up">

                    <span class="page-badge floating-badge">

                        <i class="fa-solid fa-user-graduate" aria-hidden="true"></i>

                        Student Profile

                    </span>

                    <h1>Your Student Profile</h1>

                    <p>

                        View and manage your personal information, academic details,
                        emergency contacts and account status from one secure place.

                    </p>

                </header>

            </div>

        </section>

        <!-- Personal Information -->

        <section class="profile-section">

            <div class="container">

                <div class="profile-card reveal fade-up">

                    <div class="dashboard-welcome">

                        <img id="studentAvatar" src="../assets/images/default-avatar.png" alt="Student Profile Picture">

                        <div>

                            <h2 id="studentName">
                                Student Name
                            </h2>

                            <p id="studentUniversity">
                                University
                            </p>

                        </div>

                    </div>

                    <div class="section-header">

                        <h2>Personal Information</h2>

                    </div>

                    <div class="profile-grid">

                        <div class="profile-item">

                            <label>Full Name</label>

                            <p id="fullName"></p>

                        </div>

                        <div class="profile-item">

                            <label>Email</label>

                            <p id="email"></p>

                        </div>

                        <div class="profile-item">

                            <label>Phone Number</label>

                            <p id="phone"></p>

                        </div>

                        <div class="profile-item">

                            <label>Gender</label>

                            <p id="gender"></p>

                        </div>

                        <div class="profile-item">

                            <label>Date of Birth</label>

                            <p id="dateOfBirth"></p>

                        </div>

                        <div class="profile-item">

                            <label>State of Origin</label>

                            <p id="state"></p>

                        </div>

                    </div>

                </div>

            </div>

        </section>

        <!-- Academic Information -->

        <section class="profile-section">

            <div class="container">

                <div class="profile-card reveal fade-up">

                    <div class="section-header">

                        <h2>Academic Information</h2>

                    </div>

                    <div class="profile-grid">

                        <div class="profile-item">

                            <label>University</label>

                            <p id="university"></p>

                        </div>

                        <div class="profile-item">

                            <label>Faculty</label>

                            <p id="faculty"></p>

                        </div>

                        <div class="profile-item">

                            <label>Department</label>

                            <p id="department"></p>

                        </div>

                        <div class="profile-item">

                            <label>Level</label>

                            <p id="level"></p>

                        </div>

                        <div class="profile-item">

                            <label>Matric Number</label>

                            <p id="matricNumber"></p>

                        </div>

                    </div>

                </div>

            </div>

        </section>

        <!-- Emergency Contact -->

        <section class="profile-section">

            <div class="container">

                <div class="profile-card reveal fade-up">

                    <div class="section-header">

                        <h2>Emergency Contact</h2>

                    </div>

                    <div class="profile-grid">

                        <div class="profile-item">

                            <label>Name</label>

                            <p id="emergencyName"></p>

                        </div>

                        <div class="profile-item">

                            <label>Relationship</label>

                            <p id="emergencyRelationship"></p>

                        </div>

                        <div class="profile-item">

                            <label>Phone Number</label>

                            <p id="emergencyPhone"></p>

                        </div>

                    </div>

                </div>

            </div>

        </section>

        <!-- Account Status -->

        <section class="profile-section">

            <div class="container">

                <div class="profile-card reveal fade-up">

                    <div class="section-header">

                        <h2>Account Status</h2>

                    </div>

                    <div class="profile-grid">

                        <div class="profile-item">

                            <label>Email Verification</label>

                            <p id="emailStatus"></p>

                        </div>

                        <div class="profile-item">

                            <label>Phone Verification</label>

                            <p id="phoneStatus"></p>

                        </div>

                        <div class="profile-item">

                            <label>Member Since</label>

                            <p id="memberSince"></p>

                        </div>

                    </div>

                </div>

            </div>

        </section>

        <!-- Profile Actions -->

        <section class="profile-actions reveal fade-up">

            <div class="container">

                <a href="../student/edit_profile.htm" class="btn-primary magnetic-btn ripple-btn shine-btn">

                    <i class="fa-solid fa-user-pen" aria-hidden="true"></i>

                    Edit Profile

                </a>

                <a href="../student/dashboard_student.htm" class="btn-primary magnetic-btn ripple-btn shine-btn">

                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>

                    Back to Dashboard

                </a>

            </div>

        </section>

    </main>
    <!-- FOOTER -->

    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

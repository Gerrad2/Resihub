<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications | ResiHub</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/style.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="page-notifications" data-resihub-surface="student">
    <div id="scrollProgress"></div>

    <!-- HEADER -->
    <div id="header"></div>

    <main>
        <!-- HERO -->
        <section id="notifications-hero" class="n-hero">
            <div class="container">
                <span class="n-badge"><i class="fa-solid fa-bell" aria-hidden="true"></i>Notifications</span>
                <h1>Notifications</h1>
                <p class="n-sub">Stay updated with bookings, messages, inspections and account activity.</p>
            </div>
        </section>

        <!-- LIST -->
        <section class="n-section">
            <div class="container">
                <div class="n-card">
                    <div id="notificationList" class="n-list" aria-live="polite"></div>

                    <div id="emptyNotifications" class="n-empty hidden">
                        <i class="fa-solid fa-bell-slash" aria-hidden="true"></i>
                        <h2>No Notifications</h2>
                        <p>You're all caught up. New notifications will appear here when there is activity on your
                            account.</p>
                    </div>
                </div>

                <div class="n-footer">
                    <button id="markAllReadBtn" class="n-markall hidden" type="button"
                        aria-label="Mark all notifications as read">
                        <i class="fa-solid fa-check-double" aria-hidden="true"></i> Mark all as read
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
    <script type="module">
        import { init } from "../js/notification.js";
        init();
    </script>
</body>

</html>

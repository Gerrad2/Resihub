<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Requests | ResiHub</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="page-booking-requests" data-resihub-surface="student">
    <div id="scrollProgress"></div>

    <!-- HEADER -->
    <div id="header"></div>

    <main>
        <!-- HERO -->
        <section id="booking-hero" class="booking-hero">
            <div class="container">
                <span class="booking-badge"><i class="fa-solid fa-calendar-check" aria-hidden="true"></i>Bookings</span>
                <h1>Booking Requests</h1>
                <p class="booking-sub">Track your accommodation requests and their status.</p>
            </div>
        </section>

        <!-- FILTERS + TABLE -->
        <section id="booking-content" class="booking-section">
            <div class="container">

                <div class="booking-toolbar">
                    <div class="booking-tabs" role="tablist" aria-label="Filter by status">
                        <button class="booking-tab active" type="button" role="tab" data-booking-tab="">
                            All (<span id="allCount">0</span>)
                        </button>
                        <button class="booking-tab" type="button" role="tab" data-booking-tab="pending">
                            Pending (<span id="pendingCount">0</span>)
                        </button>
                        <button class="booking-tab" type="button" role="tab" data-booking-tab="approved">
                            Approved (<span id="approvedCount">0</span>)
                        </button>
                        <button class="booking-tab" type="button" role="tab" data-booking-tab="rejected">
                            Rejected (<span id="rejectedCount">0</span>)
                        </button>
                    </div>

                    <form id="bookingFilterForm" class="booking-filter">
                        <label class="visually-hidden" for="bookingSearch">Search booking requests</label>
                        <input type="search" id="bookingSearch" placeholder="Search by property or university">

                        <label class="visually-hidden" for="bookingStatus">Filter by status</label>
                        <select id="bookingStatus" hidden>
                            <option value="">All Requests</option>
                            <option value="pending">Pending</option>
                            <option value="approved">Approved</option>
                            <option value="rejected">Rejected</option>
                        </select>
                    </form>
                </div>

                <div class="booking-card">
                    <div id="bookingRequests" aria-live="polite"></div>
                </div>

                <div id="emptyBookings" class="empty-state hidden">
                    <i class="fa-solid fa-calendar-xmark" aria-hidden="true"></i>
                    <h3>No Booking Requests</h3>
                    <p>Requests you send to landlords will appear here.</p>
                </div>

                <p class="booking-note">
                    <i class="fa-regular fa-paper-plane" aria-hidden="true"></i>
                    You'll be notified once your request is updated.
                </p>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
    <script type="module">
        import { init } from "../js/booking_requests.js";
        init();
    </script>
</body>

</html>

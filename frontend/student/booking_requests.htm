<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Booking Requests | ResiHub</title>

    <meta name="description"
        content="Manage student inspection and booking requests on ResiHub. View, search, filter and respond to booking requests.">

    <meta name="keywords" content="ResiHub, booking requests, inspections, landlord dashboard, student accommodation">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/booking_request.htm">

    <!-- Open Graph -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Booking Requests | ResiHub">

    <meta property="og:description" content="Manage booking and inspection requests from students.">

    <meta property="og:url" content="https://www.resihub.com/booking_request.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- Twitter -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Booking Requests | ResiHub">

    <meta name="twitter:description" content="Manage booking and inspection requests from students.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../styles/style.css">
</head>

<body>
    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>
    <!-- HEADER / NAVIGATION-->

    <div id="header"></div>

    <main>

        <section id="booking-hero" class="auth-hero reveal fade-up">

            <div class="container">

                <div class="page-hero-content hero-content">

                    <span class="page-badge floating-badge">

                        <i class="fa-solid fa-calendar-check"></i>

                        Bookings

                    </span>

                    <h1 class="hero-title">
                        Booking Requests
                    </h1>

                    <p class="hero-description">
                        Manage inspection requests and accommodation bookings from students in one place.
                    </p>

                </div>

            </div>

        </section>
        <div class="dashboard-stats">

            <article class="dashboard-stat-card">

                <i class="fa-solid fa-clock"></i>

                <h2 id="pendingCount">0</h2>

                <p>Pending</p>

            </article>

            <article class="dashboard-stat-card">

                <i class="fa-solid fa-circle-check"></i>

                <h2 id="approvedCount">0</h2>

                <p>Approved</p>

            </article>

            <article class="dashboard-stat-card">

                <i class="fa-solid fa-circle-xmark"></i>

                <h2 id="rejectedCount">0</h2>

                <p>Rejected</p>

            </article>

        </div>
        <section id="booking-content" class="auth-section reveal fade-up">

            <div class="container">

                <div class="booking-filter-card">

                    <form id="bookingFilterForm">

                        <label class="visually-hidden" for="bookingSearch">
                            Search Booking Requests
                        </label>

                        <input type="search" id="bookingSearch" placeholder="Search by student or property">

                        <label class="visually-hidden" for="bookingStatus">
                            Filter by Status
                        </label>

                        <select id="bookingStatus">

                            <option value="">All Requests</option>

                            <option value="pending">Pending</option>
                            <option value="approved">Approved</option>
                            <option value="rejected">Rejected</option>

                        </select>

                    </form>

                </div>


                <div id="bookingRequests" class="booking-grid" aria-live="polite">

                    <!-- Booking request cards will be inserted here -->

                </div>

            </div>

            <div id="emptyBookings" class="empty-state hidden">

                <i class="fa-solid fa-calendar-xmark"></i>

                <h3>No Booking Requests</h3>

                <p>

                    Inspection requests from students will appear here.

                </p>

            </div>
        </section>
    </main>
    <!--FOOTER-->

    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saved Properties | ResiHub</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="page-saved" data-resihub-surface="student">
    <div id="scrollProgress"></div>

    <!-- HEADER -->
    <div id="header"></div>

    <main>
        <!-- HERO -->
        <section class="sv-hero">
            <div class="container">
                <span class="sv-badge"><i class="fa-solid fa-heart" aria-hidden="true"></i>Saved Properties</span>
                <h1 id="savedPropertiesTitle">Your Saved Accommodation</h1>
                <p class="sv-sub">View and manage all the properties you've saved for future reference.</p>
            </div>
        </section>

        <section class="sv-section">
            <div class="container">

                <div class="sv-toolbar">
                    <div class="sv-tabs" role="tablist" aria-label="Filter saved properties">
                        <button class="sv-tab active" type="button" role="tab" data-saved-tab="all">
                            All (<span id="savedAllCount">0</span>)
                        </button>
                        <button class="sv-tab" type="button" role="tab" data-saved-tab="available">
                            Available (<span id="savedAvailableCount">0</span>)
                        </button>
                        <button class="sv-tab" type="button" role="tab" data-saved-tab="booked">
                            Booked (<span id="savedBookedCount">0</span>)
                        </button>
                    </div>

                    <button id="clearSavedBtn" class="sv-clear" type="button">
                        <i class="fa-solid fa-trash" aria-hidden="true"></i> Clear All
                    </button>
                </div>

                <div id="savedListings" class="sv-grid" aria-live="polite"></div>

                <div id="emptySaved" class="sv-empty hidden">
                    <i class="fa-solid fa-heart-crack" aria-hidden="true"></i>
                    <h2>No Saved Properties</h2>
                    <p>You haven't saved any accommodation yet. Tap the heart on any room to keep it here.</p>
                    <a href="../general/browse_rooms.htm" class="sv-primary">Browse Rooms</a>
                </div>

            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
    <script type="module">
        import { init } from "../js/saved_properties.js";
        init();
    </script>
</body>

</html>

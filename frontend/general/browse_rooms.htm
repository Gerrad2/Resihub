<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse Student Accommodation Near Nigerian Universities | ResiHub</title>
    <meta name="description"
        content="Browse verified hostels, self-contained apartments and shared rooms near Nigerian universities on ResiHub.">
    <meta name="keywords"
        content="browse student rooms Nigeria, hostels near university, shared apartments, self contain, ResiHub">
    <meta name="robots" content="index, follow">

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="page-browse" data-resihub-surface="public">
    <div id="scrollProgress"></div>

    <!-- HEADER -->
    <div id="header"></div>

    <main>
        <!-- PAGE HERO + SEARCH -->
        <section class="browse-hero">
            <div class="container">
                <span class="browse-badge"><i class="fa-solid fa-house" aria-hidden="true"></i>Browse Student
                    Housing</span>
                <h1>Browse Rooms</h1>
                <p class="browse-sub">Find the perfect room that suits your budget and location.</p>

                <form id="browseSearchForm" class="browse-search" autocomplete="off">
                    <div class="search-field">
                        <label for="browseArea" class="sr-only">Location</label>
                        <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                        <input type="text" id="browseArea" name="area" placeholder="Location">
                    </div>
                    <div class="search-field">
                        <label for="browseUniversity" class="sr-only">University</label>
                        <i class="fa-solid fa-building-columns" aria-hidden="true"></i>
                        <select id="browseUniversity" name="university">
                            <option value="">University</option>
                        </select>
                    </div>
                    <div class="search-field">
                        <label for="browseType" class="sr-only">Property type</label>
                        <i class="fa-solid fa-house" aria-hidden="true"></i>
                        <select id="browseType" name="propertyType">
                            <option value="">Any type</option>
                            <option value="self-contain">Self Contain</option>
                            <option value="single-room">Single Room</option>
                            <option value="shared-room">Shared Room</option>
                            <option value="1-bedroom">1 Bedroom</option>
                            <option value="2-bedroom">2 Bedroom</option>
                            <option value="3-bedroom">3 Bedroom</option>
                            <option value="apartment">Apartment</option>
                            <option value="hostel">Hostel</option>
                        </select>
                    </div>
                    <div class="search-field">
                        <label for="browseBudget" class="sr-only">Maximum price (NGN)</label>
                        <i class="fa-solid fa-naira-sign" aria-hidden="true"></i>
                        <input type="number" id="browseBudget" name="maxBudget" placeholder="Price range">
                    </div>
                    <button type="submit" class="browse-search-btn"><i class="fa-solid fa-magnifying-glass"
                            aria-hidden="true"></i>Search</button>
                </form>
            </div>
        </section>

        <!-- FILTERS + RESULTS -->
        <section class="browse-body">
            <div class="container browse-layout">

                <!-- FILTERS -->
                <aside class="filters-panel" id="filtersPanel" aria-label="Filter rooms">
                    <form id="filterForm">
                        <div class="filters-head">
                            <h2><i class="fa-solid fa-sliders" aria-hidden="true"></i>Filters</h2>
                            <button type="button" id="resetFilters" class="clear-btn">Clear All</button>
                        </div>

                        <fieldset class="filter-group">
                            <legend>Price Range</legend>
                            <div class="range-row">
                                <div class="form-group">
                                    <label for="minPrice" class="sr-only">Minimum price</label>
                                    <input type="number" id="minPrice" name="minPrice" placeholder="Min ₦">
                                </div>
                                <div class="form-group">
                                    <label for="maxPrice" class="sr-only">Maximum price</label>
                                    <input type="number" id="maxPrice" name="maxPrice" placeholder="Max ₦">
                                </div>
                            </div>
                        </fieldset>

                        <fieldset class="filter-group">
                            <legend>Availability</legend>
                            <div class="form-group">
                                <label for="availability" class="sr-only">Availability</label>
                                <select id="availability" name="availability">
                                    <option value="">Any</option>
                                    <option value="available">Available Now</option>
                                    <option value="booked">Already Booked</option>
                                </select>
                            </div>
                        </fieldset>

                        <fieldset class="filter-group amenities-section">
                            <legend>Amenities</legend>
                            <div class="amenities-grid">
                                <label class="checkbox-item"><input type="checkbox" id="wifi" name="amenities"
                                        value="wifi"><span>Wi-Fi</span></label>
                                <label class="checkbox-item"><input type="checkbox" id="water" name="amenities"
                                        value="water"><span>Water</span></label>
                                <label class="checkbox-item"><input type="checkbox" id="electricity" name="amenities"
                                        value="electricity"><span>Electricity</span></label>
                                <label class="checkbox-item"><input type="checkbox" id="security" name="amenities"
                                        value="security"><span>Security</span></label>
                                <label class="checkbox-item"><input type="checkbox" id="parking" name="amenities"
                                        value="parking"><span>Parking</span></label>
                                <label class="checkbox-item"><input type="checkbox" id="furnished" name="amenities"
                                        value="furnished"><span>Furnished</span></label>
                                <label class="checkbox-item"><input type="checkbox" id="kitchen" name="amenities"
                                        value="kitchen"><span>Kitchen</span></label>
                                <label class="checkbox-item"><input type="checkbox" id="bathroom" name="amenities"
                                        value="bathroom"><span>Bathroom</span></label>
                            </div>
                        </fieldset>
                    </form>
                </aside>

                <!-- RESULTS -->
                <div class="results">
                    <div class="listings-header">
                        <p id="listingResults">Loading available rooms...</p>

                        <div class="results-tools">
                            <button type="button" id="toggleFilters" class="filter-toggle"><i class="fa-solid fa-filter"
                                    aria-hidden="true"></i>Filters</button>

                            <label class="sort-label" for="sortBy">Sort by</label>
                            <select id="sortBy" name="sortBy" class="sort-select">
                                <option value="newest">Newest</option>
                                <option value="lowest">Lowest Price</option>
                            </select>

                            <div class="view-options">
                                <button type="button" id="gridView" class="view-btn active" aria-label="Grid view"><i
                                        class="fa-solid fa-table-cells-large" aria-hidden="true"></i></button>
                                <button type="button" id="listView" class="view-btn" aria-label="List view"><i
                                        class="fa-solid fa-list" aria-hidden="true"></i></button>
                            </div>
                        </div>
                    </div>

                    <div id="listingsContainer" class="listings-grid" aria-live="polite"></div>

                    <div id="noListings" class="empty-state hidden">
                        <i class="fa-solid fa-magnifying-glass-location" aria-hidden="true"></i>
                        <p>No rooms match your filters yet.</p>
                        <button type="button" id="clearSearch" class="btn-primary">Clear Filters</button>
                    </div>

                    <div class="load-more">
                        <button type="button" id="loadMoreBtn" class="btn-outline"><i class="fa-solid fa-plus"
                                aria-hidden="true"></i>Load more rooms</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>


    <script type="module" src="../js/core/app.js"></script>
    <script type="module">
        import { init } from "../js/browse_rooms.js";
        init();
    </script>
</body>

</html>

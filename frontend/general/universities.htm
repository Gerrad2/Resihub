<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ResiHub | Universities</title>

    <meta name="description"
        content="Browse Nigerian universities and find verified student accommodation near your campus with ResiHub.">

    <meta name="keywords" content="ResiHub, Nigerian Universities, Student Accommodation, Hostels, Student Housing">

    <meta name="author" content="ResiHub">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body data-resihub-surface="public" id="top">

    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">
        <span class="shape shape-1"></span>
        <span class="shape shape-2"></span>
        <span class="shape shape-3"></span>
        <span class="shape shape-4"></span>
    </div>

    <!-- ================= HEADER ================= -->

    <div id="header"></div>

    <!-- ================= MAIN ================= -->

    <main>

        <!-- Hero -->

        <section class="universities-hero">

            <div class="container">

                <span class="page-badge floating-badge">

                    <i class="fa-solid fa-building-columns"></i>

                    Nigerian Universities

                </span>

                <h1>Find Accommodation Near Your University</h1>

                <p>

                    Browse verified student accommodation around universities across Nigeria.

                </p>

            </div>

        </section>

        <!-- Statistics -->

        <section class="universities-stats">

            <div class="container">

                <div class="stats-grid">

                    <div class="stat-card">

                        <h2 id="totalUniversities">0</h2>

                        <p>Universities</p>

                    </div>

                    <div class="stat-card">

                        <h2 id="totalListings">0</h2>

                        <p>Available Listings</p>

                    </div>

                    <div class="stat-card">

                        <h2 id="totalStates">0</h2>

                        <p>States Covered</p>

                    </div>

                </div>

            </div>

        </section>

        <!-- Search -->

        <section class="universities-search">

            <div class="container">

                <form id="universitySearchForm">

                    <div class="search-box">

                        <input type="text" id="searchUniversity" placeholder="Search by university name..."
                            autocomplete="off">

                        <button type="submit" class="btn-primary">

                            <i class="fa-solid fa-magnifying-glass"></i>

                            Search

                        </button>

                    </div>

                </form>

            </div>

        </section>

        <!-- Filter -->

        <section class="universities-filter">

            <div class="container">

                <select id="stateFilter">

                    <option value="">All States</option>

                </select>

            </div>

        </section>

        <!-- Universities -->

        <section class="universities-list">

            <div class="container">

                <div id="universitiesGrid" class="universities-grid">

                </div>

            </div>

        </section>

        <!-- Empty State -->

        <section id="emptyUniversities" class="empty-state hidden">

            <div class="container">

                <i class="fa-solid fa-building-circle-xmark"></i>

                <h2>No Universities Found</h2>

                <p>

                    Try another search term or browse all universities.

                </p>

                <button id="resetUniversitySearch" class="btn-primary">

                    View All Universities

                </button>

            </div>

        </section>

    </main>

    <!-- ================= FOOTER ================= -->

    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

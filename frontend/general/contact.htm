<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact ResiHub | Student Accommodation Support Nigeria</title>

    <meta name="description"
        content="Contact ResiHub for student accommodation enquiries, technical support, partnerships, landlord assistance and general questions across Nigeria.">

    <meta name="keywords"
        content="ResiHub contact, student accommodation support, Nigeria hostel support, contact ResiHub, landlord support, student housing">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://www.resihub.com/contact.htm">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ResiHub">
    <meta property="og:title" content="Contact ResiHub">
    <meta property="og:description"
        content="Need help? Contact the ResiHub team for student accommodation support, partnerships and enquiries.">
    <meta property="og:url" content="https://www.resihub.com/contact.htm">
    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contact ResiHub">
    <meta name="twitter:description" content="Contact the ResiHub support team for help with student accommodation.">
    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body data-resihub-surface="public">
    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <div id="header"></div>

    <main>
        <section id="contact-hero" class="page-hero reveal fade-up">

            <div class="container">

                <div class="page-hero-content">

                    <div class="hero-text">

                        <span class="page-badge floating-badge">
                            <i class="fa-solid fa-headset" aria-hidden="true"></i>
                            Contact Us
                        </span>
                        <h1 class="hero-title">
                            We're Here to Help
                        </h1>

                        <p class="hero-description">
                            Questions, feedback or support?
                            Our team is always ready to help.
                        </p>
                    </div>

                    <div class="hero-buttons">

                        <a href="#contactForm" class="btn-primary">

                            <i class="fa-solid fa-paper-plane"></i>

                            Send Message

                        </a>

                        <a href="../general/faq.htm" class="btn-primary">

                            <i class="fa-solid fa-circle-question"></i>

                            Visit FAQ

                        </a>

                    </div>
                </div>
        </section>
        <section class="contact-section reveal fade-up">
            <div class="container">
                <div class="contact-layout">

                    <div class="contact-form glass-card reveal zoom-in">
                        <form id="contactForm">

                            <div class="form-group">
                                <label for="contactName">Full Name</label>
                                <input id="contactName" name="name" type="text" placeholder="Full Name"
                                    autocomplete="name" required>
                            </div>

                            <div class="form-group">
                                <label for="contactEmail">Email Address</label>
                                <input id="contactEmail" name="email" type="email" placeholder="Email Address"
                                    autocomplete="email" required>
                            </div>

                            <div class="form-group">
                                <label for="contactSubject">Subject</label>
                                <input id="contactSubject" name="subject" type="text" placeholder="Subject"
                                    autocomplete="off">
                            </div>

                            <div class="form-group">
                                <label for="contactMessage">Message</label>
                                <textarea id="contactMessage" name="message" rows="6" placeholder="Type your message..."
                                    required></textarea>
                            </div>

                            <button type="submit" id="sendMessageBtn"
                                class="btn-primary magnetic-btn ripple-btn shine-btn">

                                <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                                Send Message

                            </button>

                        </form>
                    </div>

                    <div class="contact-info">
                        <div class="contact-card glass-card reveal zoom-in">
                            <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                            <h3>Email</h3>
                            <p id="supportEmail"></p>
                        </div>
                        <div class="contact-card glass-card reveal zoom-in">
                            <i class="fa-solid fa-phone" aria-hidden="true"></i>
                            <h3>Phone</h3>
                            <p id="supportPhone"></p>
                        </div>
                        <div class="contact-card glass-card reveal zoom-in">
                            <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                            <h3>Office</h3>
                            <p id="officeAddress"></p>
                        </div>
                        <div class="contact-card glass-card reveal zoom-in">
                            <i class="fa-solid fa-clock" aria-hidden="true"></i>
                            <h3>Working Hours</h3>
                            <p id="workingHours"></p>
                        </div>
                        <div class="social-links">

                            <a id="contactFacebookLink" href="#" target="_blank" rel="noopener"
                                aria-label="Visit our Facebook page">

                                <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>

                            </a>

                            <a id="contactInstagramLink" href="#" target="_blank" rel="noopener"
                                aria-label="Visit our Instagram page">

                                <i class="fa-brands fa-instagram" aria-hidden="true"></i>

                            </a>

                            <a id="contactLinkedinLink" href="#" target="_blank" rel="noopener"
                                aria-label="Visit our LinkedIn page">

                                <i class="fa-brands fa-linkedin" aria-hidden="true"></i>

                            </a>

                            <a id="contactTwitterLink" href="#" target="_blank" rel="noopener"
                                aria-label="Visit our X (Twitter) page">

                                <i class="fa-brands fa-x-twitter" aria-hidden="true"></i>

                            </a>

                        </div>
                    </div>

                </div>
            </div>
        </section>
        <section class="office-map reveal fade-up">
            <div class="container">
                <div class="section-header">

                    <span class="section-badge">

                        Office Location

                    </span>

                    <h2>

                        Visit Our Office

                    </h2>

                    <p>

                        We'd love to hear from you.

                    </p>

                </div>
            </div>
            <div id="officeMap" role="region" aria-label="Office Location">
            </div>
            </div>
        </section>
        <section class="quick-help reveal fade-up">
            <div class="container">
                <div class="help-grid">
                    <a href="../general/faq.htm" class="help-card">
                        <i class="fa-solid fa-circle-question" aria-hidden="true"></i>
                        FAQ
                    </a>
                    <a href="../general/browse_rooms.htm" class="help-card">
                        <i class="fa-solid fa-house" aria-hidden="true"></i>
                        Library
                    </a>
                    <a href="../auth/student_login.htm" class="help-card">
                        <i class="fa-solid fa-user" aria-hidden="true"></i>
                        Student Portal
                    </a>
                    <a href="../auth/landlord_login.htm" class="help-card">
                        <i class="fa-solid fa-building" aria-hidden="true"></i>
                        Landlord Portal
                    </a>
                </div>
            </div>
        </section>
    </main>
    <!--FOOTER-->

    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

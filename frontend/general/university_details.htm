<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>University Details | ResiHub</title>
    <meta name="description"
        content="Learn about this university, its campus and student rooms available nearby on ResiHub.">
    <meta name="robots" content="index, follow">

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="page-university" data-resihub-surface="public">
    <div id="scrollProgress"></div>

    <!-- HEADER -->
    <div id="header"></div>

    <main>
        <!-- UNIVERSITY HERO -->
        <section class="uni-hero">
            <img id="universityLogoBg" class="uni-logo-bg" alt="" hidden>

            <div class="container uni-hero-inner">
                <img id="universityImage" class="uni-logo-large" alt="University logo" hidden>

                <div class="uni-id">
                    <span class="uni-chip">University accommodation</span>
                    <h1 id="universityName">Loading university...</h1>
                    <p class="uni-loc">
                        <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
                        <span id="universityCity"></span><span class="sep">,</span><span id="universityState"></span>
                    </p>
                    <p id="universityLocation" class="uni-address"></p>
                </div>
            </div>
        </section>

        <!-- TABS -->
        <nav class="uni-tabs" aria-label="University sections">
            <div class="container">
                <a href="#overview" class="active">Overview</a>
                <a href="#nearby">Nearby Rooms</a>
                <a href="#campus">Campus Map</a>
            </div>
        </nav>

        <!-- BODY -->
        <section class="uni-body">
            <div class="container uni-layout">

                <!-- MAIN COLUMN -->
                <div class="uni-main">
                    <section id="overview" class="panel">
                        <h2>About University</h2>
                        <p id="universityDescription" class="about-text"></p>

                        <h3>Key Features</h3>
                        <div id="facilitiesGrid" class="facilities-grid"></div>

                        <h3>Student Tips</h3>
                        <div id="studentTips" class="tips"></div>
                    </section>

                    <section class="panel">
                        <h2>Popular Areas</h2>
                        <div id="areasGrid" class="areas-grid"></div>
                    </section>

                    <section id="nearby" class="panel">
                        <div class="panel-head">
                            <h2>Nearby Rooms</h2>
                            <span class="count-pill"><span id="listingCount">0</span> available</span>
                        </div>
                        <div id="nearbyListings" class="listing-grid"></div>
                    </section>

                    <section class="panel">
                        <h2>Frequently Asked Questions</h2>
                        <div id="faqContainer" class="faq-list"></div>
                    </section>
                </div>

                <!-- SIDE COLUMN -->
                <aside class="uni-side">
                    <div class="side-card">
                        <h3>At a glance</h3>
                        <ul class="glance">
                            <li><i class="fa-solid fa-user-graduate" aria-hidden="true"></i><span>Students</span><strong
                                    id="studentPopulation">—</strong></li>
                            <li><i class="fa-solid fa-house" aria-hidden="true"></i><span>Listings</span><strong
                                    id="highlightListings">—</strong></li>
                            <li><i class="fa-solid fa-route" aria-hidden="true"></i><span>Distance</span><strong
                                    id="highlightDistance">—</strong></li>
                            <li><i class="fa-solid fa-circle-check" aria-hidden="true"></i><span>Verified</span><strong
                                    id="highlightVerified">—</strong></li>
                            <li><i class="fa-solid fa-map-pin" aria-hidden="true"></i><span>Areas</span><strong
                                    id="highlightAreas">—</strong></li>
                        </ul>
                    </div>

                    <section id="campus" class="side-card">
                        <h3>Campus Map</h3>
                        <div id="campusMap" class="map-box"></div>
                    </section>
                </aside>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
    <script type="module">
        import { init } from "../js/university_details.js";
        init();
    </script>
</body>

</html>

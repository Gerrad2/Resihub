<!DOCTYPE html>

<html lang="en">

<head>

    <!-- Character Encoding -->

    <meta charset="UTF-8">

    <!-- Responsive -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->

    <title>

        500 | Internal Server Error | ResiHub

    </title>

    <meta name="description" content="An unexpected server error occurred while processing your request.">

    <meta name="robots" content="noindex, nofollow">

    <!-- Theme Color -->

    <meta name="theme-color" content="#0D6EFD">

    <!-- Favicon -->

    <link rel="icon" href="../assets/images/favicon.png">

    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main Stylesheet -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body data-resihub-surface="system">

    <!-- ==========================
         Header
    =========================== -->

    <div id="header"></div>

    <!-- ==========================
         Main Content
    =========================== -->

    <main class="system-page">

        <section class="system-container">

            <div class="system-icon">

                <i class="fa-solid fa-triangle-exclamation"></i>

            </div>

            <span class="system-code">

                Error 500

            </span>

            <h1>

                Internal Server Error

            </h1>

            <p>

                Something unexpected happened while processing your request.

                Our technical team has been notified and is working to resolve the issue.

            </p>

            <div class="system-info">

                <div class="info-card">

                    <i class="fa-solid fa-server"></i>

                    <span>

                        Server Error

                    </span>

                </div>

                <div class="info-card">

                    <i class="fa-solid fa-gears"></i>

                    <span>

                        System Recovery

                    </span>

                </div>

                <div class="info-card">

                    <i class="fa-solid fa-headset"></i>

                    <span>

                        Support Available

                    </span>

                </div>

            </div>

            <div class="system-actions">

                <button class="btn btn-outline" onclick="location.reload()">

                    <i class="fa-solid fa-rotate"></i>

                    Try Again

                </button>

                <a href="../general/index.htm" class="btn btn-primary">

                    <i class="fa-solid fa-house"></i>

                    Home

                </a>

                <a href="../general/contact.htm" class="btn btn-secondary">

                    <i class="fa-solid fa-headset"></i>

                    Report Issue

                </a>

            </div>

        </section>

    </main>

    <!-- ==========================
         Footer
    =========================== -->

    <div id="footer"></div>

    <!-- ==========================
         Scripts
    =========================== -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

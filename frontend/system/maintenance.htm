<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduled Maintenance | ResiHub</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles/system.css">
</head>

<body class="sys-page" data-resihub-surface="public">
    <div id="scrollProgress"></div>
    <div id="header"></div>

    <main class="sys-main">
        <section class="sys-panel">

            <div class="sys-art" aria-hidden="true">
                <div class="sys-art-glow"></div>
                <i class="fa-solid fa-wrench sys-art-icon"></i>
            </div>

            <h1 class="sys-title">Scheduled Maintenance</h1>
            <p class="sys-text">We're currently performing scheduled maintenance to improve your experience. We'll be
                back online soon.</p>

            <p class="sys-expected">
                <i class="fa-regular fa-clock" aria-hidden="true"></i>
                Expected return: <span data-expected>Soon</span>
            </p>

            <div class="sys-actions">
                <button type="button" class="sys-btn sys-btn-primary" data-action="reload">
                    <i class="fa-solid fa-rotate" aria-hidden="true"></i> Try Again
                </button>
            </div>

            <p class="sys-ref">Reference: <span data-reference></span></p>
        </section>
    </main>

    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
    <script type="module">
        import { initSystemPage } from "../js/core/system-pages.js";
        initSystemPage();
    </script>
</body>

</html>

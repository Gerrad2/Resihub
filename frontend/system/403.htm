<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Forbidden | ResiHub</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/system.css">
</head>

<body class="sys-page" data-resihub-surface="public">
    <div id="scrollProgress"></div>
    <div id="header"></div>

    <main class="sys-main">
        <section class="sys-panel">

            <div class="sys-art" aria-hidden="true">
                <div class="sys-art-glow"></div>
                <i class="fa-solid fa-shield-halved sys-art-icon"></i>
                <span class="sys-badge danger"><i class="fa-solid fa-ban"></i></span>
            </div>

            <p class="sys-code">403</p>
            <h1 class="sys-title">Access Forbidden</h1>
            <p class="sys-text">You don't have permission to view this page. This could be due to restricted access or insufficient privileges.</p>

            <div class="sys-actions">
                <a href="../general/index.htm" class="sys-btn sys-btn-primary">
                    <i class="fa-solid fa-house" aria-hidden="true"></i> Back to Home
                </a>
                <button type="button" class="sys-btn sys-btn-ghost" data-action="back">
                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Go Back
                </button>
            </div>

            <p class="sys-ref">Reference: <span data-reference></span></p>
        </section>
    </main>

    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
    <script type="module">
        import { initSystemPage } from "../js/core/system-pages.js";
        initSystemPage();
    </script>
</body>

</html>

<body>
    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>
    <!-- HEADER / NAVIGATION-->

    <div id="header"></div>

    <main>
        <section class="page-hero">

            <div class="container">

                <section id="account-suspended-hero" class="auth-hero reveal fade-up">


                    <span class="page-badge floating-badge">
                        <i class="fa-solid fa-gear"></i>
                        Settings
                    </span>

                    <h1>Account Settings</h1>

                    <p>Manage your account preferences and security.</p>

            </div>

            </div>

        </section>

        <section class="settings-page">

            <div class="container">

                <form id="settingsForm">

                    <div class="settings-card">

                        <h2>Preferences</h2>

                        <div class="setting-item">

                            <div>

                                <h3>Email Notifications</h3>

                                <p>Receive booking requests, messages and important account updates.</p>

                            </div>

                            <label class="switch">

                                <input type="checkbox" id="marketingEmails">
                                Email Notification

                                <span class="slider"></span>

                            </label>

                        </div>

                        <label>
                            <input type="checkbox" id="inspectionNotifications">

                            SMS Notifications
                        </label>

                        <label>
                            <input type="checkbox" id="listingVisibility">

                            Dark Mode
                        </label>

                    </div>

                    <div class="settings-card">

                        <h2>Security</h2>

                        <a href="../auth/reset_password.htm" class="btn-primary magnetic-btn ripple-btn shine-btn">

                            Change Password

                        </a>

                    </div>

                    <button type="submit" id="saveSettingsBtn" class="btn-primary">

                        Save Settings

                    </button>

                </form>

            </div>

        </section>

    </main>
    <!--FOOTER-->

    <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>

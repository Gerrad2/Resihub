<head>

    <!-- ==========================================
         Basic Meta Information
    =========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Notifications | ResiHub</title>

    <meta name="description"
        content="View and manage system notifications, alerts and announcements for the ResiHub administration panel.">

    <meta name="keywords" content="ResiHub, Admin, Notifications, Alerts, Messages">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_notifications.htm">

    <!-- ==========================================
         Open Graph
    =========================================== -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Admin Notifications | ResiHub">

    <meta property="og:description" content="Manage platform notifications and announcements.">

    <meta property="og:url" content="https://www.resihub.com/admin_notifications.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Twitter Card
    =========================================== -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Admin Notifications | ResiHub">

    <meta name="twitter:description" content="Manage platform notifications and announcements.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Favicon
    =========================================== -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         Fonts & Icons
    =========================================== -->

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ==========================================
         Master Stylesheet
    =========================================== -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body data-resihub-surface="admin">

    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <div id="header"></div>

    <main id="mainContent">

        <section id="adminNotificationsContent" class="page-section">

            <div class="page-container">

                <!-- Heading -->

                <header class="dashboard-heading">
                    <div>
                        <h1>Notifications</h1>
                        <p>Manage your system notifications.</p>
                        <p id="totalNotifications"></p>
                    </div>
                    <button type="button" id="markAllReadBtn" class="btn btn-primary" disabled>
                        <i class="fa-solid fa-check-double" aria-hidden="true"></i> Mark all read
                    </button>
                </header>

                <!-- Tabs -->

                <div class="notif-tabs" role="tablist" aria-label="Filter notifications">
                    <button type="button" class="notif-tab active" data-filter="all">All</button>
                    <button type="button" class="notif-tab" data-filter="unread">Unread (<span
                            id="unreadCount">0</span>)</button>
                    <button type="button" class="notif-tab" data-filter="booking">Bookings</button>
                    <button type="button" class="notif-tab" data-filter="message">Messages</button>
                    <button type="button" class="notif-tab" data-filter="review">Reviews</button>
                    <button type="button" class="notif-tab" data-filter="account">Account</button>
                </div>

                <!-- Filters -->

                <form id="notificationSearchForm" class="filter-form liquid-form" role="search">

                    <div class="liquid-group">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                        <input type="search" id="notificationSearch" name="notificationSearch" class="liquid-input"
                            placeholder="Search notifications..." aria-label="Search notifications">
                    </div>

                    <select id="notificationStatus" name="notificationStatus" class="liquid-input"
                        aria-label="Filter by read status">
                        <option value="">All Status</option>
                        <option value="unread">Unread</option>
                        <option value="read">Read</option>
                    </select>

                </form>

                <!-- Table -->

                <div class="table-wrapper">

                    <table class="admin-table">

                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Type</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="notificationHistory"></tbody>

                    </table>

                </div>

                <div id="notificationPagination" class="pagination"></div>

                <!-- Empty State -->

                <div id="noNotificationsFound" class="empty-state hidden">

                    <i class="fa-solid fa-bell-slash" aria-hidden="true"></i>

                    <h3>No Notifications</h3>

                    <p>You have no notifications that match this filter.</p>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <div id="footer"></div>

    <!-- JavaScript -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

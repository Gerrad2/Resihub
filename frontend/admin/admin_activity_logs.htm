<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================================================
         BASIC META
    ========================================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Admin Activity Logs | ResiHub</title>

    <meta name="description"
        content="Monitor administrator activities, security events, system logs and audit history across the ResiHub platform.">

    <meta name="keywords"
        content="ResiHub, Admin Activity Logs, Audit Logs, Administrator, Security Logs, Activity History">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_activity_logs.htm">

    <!-- =========================================================
         OPEN GRAPH
    ========================================================== -->

    <meta property="og:type" content="website">

    <meta property="og:site_name" content="ResiHub">

    <meta property="og:title" content="Admin Activity Logs | ResiHub">

    <meta property="og:description"
        content="Track administrator actions, security events and audit records across the ResiHub platform.">

    <meta property="og:url" content="https://www.resihub.com/admin_activity_logs.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- =========================================================
         TWITTER
    ========================================================== -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Admin Activity Logs | ResiHub">

    <meta name="twitter:description" content="Administrator activity logs and platform audit history.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- =========================================================
         THEME
    ========================================================== -->

    <meta name="theme-color" content="#0f766e">

    <meta name="color-scheme" content="light">

    <!-- =========================================================
         FAVICON
    ========================================================== -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <link rel="apple-touch-icon" href="../assets/images/favicon.png">

    <!-- =========================================================
         GOOGLE FONTS
    ========================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- =========================================================
         FONT AWESOME
    ========================================================== -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- =========================================================
         RESIHUB GLOBAL CSS
    ========================================================== -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body data-resihub-surface="admin">

    <!-- ==========================================
         Scroll Progress
    =========================================== -->

    <div id="scrollProgress"></div>

    <!-- ==========================================
         Floating Background
    =========================================== -->

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <!-- ==========================================
         Global Header
    =========================================== -->

    <div id="header"></div>

    <!-- ==========================================
         Main Content
    =========================================== -->

    <main id="mainContent">

        <section id="activityLogsContent" class="page-section">

            <div class="page-container">

                <!-- Heading -->

                <header class="dashboard-heading" id="hero-text">
                    <div>
                        <h1>Activity Logs</h1>
                        <p>Track all platform activities and user actions.</p>
                    </div>
                </header>

                <!-- Filters -->

                <div class="activity-filters glass-card">

                    <input type="date" id="activityDate" name="activityDate" class="liquid-input"
                        aria-label="Filter by date">

                    <select id="activityType" name="activityType" class="liquid-input" aria-label="Filter by action">
                        <option value="">All Actions</option>
                        <option value="login">Logged in</option>
                        <option value="logout">Logged out</option>
                        <option value="create">Created</option>
                        <option value="update">Updated</option>
                        <option value="delete">Deleted</option>
                        <option value="approve">Approved</option>
                        <option value="reject">Rejected</option>
                        <option value="suspend">Suspended</option>
                        <option value="restore">Restored</option>
                        <option value="export">Exported</option>
                        <option value="listing">Listings</option>
                        <option value="student">Students</option>
                        <option value="landlord">Landlords</option>
                        <option value="settings">Settings</option>
                    </select>

                    <select id="activityAdmin" name="activityAdmin" class="liquid-input" aria-label="Filter by user">
                        <option value="">All Users</option>
                    </select>

                </div>

                <!-- Loading -->

                <p id="activityLoading" class="activity-loading hidden">Loading activity...</p>

                <!-- Table -->

                <div class="table-wrapper">

                    <table class="admin-table activity-table">

                        <thead>
                            <tr>
                                <th>Date &amp; Time</th>
                                <th>User</th>
                                <th>Action</th>
                                <th>Details</th>
                                <th>IP Address</th>
                            </tr>
                        </thead>

                        <tbody id="activityLogsTable"></tbody>

                    </table>

                </div>

                <div id="activityPagination" class="pagination"></div>

                <!-- Empty State -->

                <div id="noActivityLogs" class="empty-state hidden">

                    <i class="fa-solid fa-clipboard-list" aria-hidden="true"></i>

                    <h3>No Activity Found</h3>

                    <p>No activity matches your current filter.</p>

                </div>

            </div>

        </section>

    </main>

    <!-- Activity details -->

    <div id="activityDetailsModal" class="modal hidden" aria-hidden="true">

        <div class="modal-content activity-details-content">

            <div class="modal-header">
                <h2 class="modal-title">Activity details</h2>
                <button type="button" id="closeActivityModal" class="modal-close" aria-label="Close">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </div>

            <div id="activityDetailsContent" class="modal-body"></div>

        </div>

    </div>

    <!-- FOOTER -->

    <div id="footer"></div>

    <!-- JavaScript -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

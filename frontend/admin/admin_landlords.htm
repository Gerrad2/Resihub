<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         Basic Meta Information
    =========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Landlords | ResiHub Admin</title>

    <meta name="description"
        content="Manage landlord accounts, verify property owners, approve listings, and monitor landlord activities on the ResiHub Administration Panel.">

    <meta name="keywords" content="ResiHub, Admin, Landlords, Property Owners, Student Accommodation, Dashboard">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_landlords.htm">

    <!-- ==========================================
         Open Graph
    =========================================== -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Manage Landlords | ResiHub Admin">

    <meta property="og:description" content="Manage landlord accounts, approvals and property ownership on ResiHub.">

    <meta property="og:url" content="https://www.resihub.com/admin_landlords.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Twitter
    =========================================== -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Manage Landlords | ResiHub Admin">

    <meta name="twitter:description" content="Manage landlords and their property listings on ResiHub.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Favicon
    =========================================== -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         Master Stylesheet
    =========================================== -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body data-resihub-surface="admin">

    <!-- ==========================================
         Scroll Progress
    =========================================== -->

    <div id="scrollProgress"></div>

    <!-- ==========================================
         Floating Background Shapes
    =========================================== -->

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <!-- ==========================================
         Dynamic Header
    =========================================== -->

    <div id="header"></div>

    <!-- ==========================================
         Main Content
    =========================================== -->

    <main id="mainContent">

        <section id="adminLandlordsContent" class="page-section">

            <div class="page-container">

                <!-- Heading -->

                <header class="dashboard-heading">
                    <div>
                        <h1>Landlords</h1>
                        <p>Manage landlord accounts and properties.</p>
                    </div>
                </header>

                <!-- Key figures -->

                <section class="statistics-section" aria-label="Landlord figures">
                    <div class="statistics-grid">

                        <article class="statistics-card glass-card">
                            <div class="card-icon card-icon-cyan"><i class="fa-solid fa-building"
                                    aria-hidden="true"></i></div>
                            <div class="card-content">
                                <p class="card-label">Total Landlords</p>
                                <h2 id="totalLandlords"></h2>
                            </div>
                        </article>

                        <article class="statistics-card glass-card">
                            <div class="card-icon card-icon-teal"><i class="fa-solid fa-circle-check"
                                    aria-hidden="true"></i></div>
                            <div class="card-content">
                                <p class="card-label">Active</p>
                                <h2 id="verifiedLandlords"></h2>
                            </div>
                        </article>

                        <article class="statistics-card glass-card">
                            <div class="card-icon card-icon-indigo"><i class="fa-solid fa-clock" aria-hidden="true"></i>
                            </div>
                            <div class="card-content">
                                <p class="card-label">Pending</p>
                                <h2 id="pendingLandlords"></h2>
                            </div>
                        </article>

                        <article class="statistics-card glass-card">
                            <div class="card-icon card-icon-blue"><i class="fa-solid fa-house" aria-hidden="true"></i>
                            </div>
                            <div class="card-content">
                                <p class="card-label">Properties</p>
                                <h2 id="totalProperties"></h2>
                            </div>
                        </article>

                    </div>
                </section>

                <!-- Filters -->

                <form id="landlordFilterForm" class="filter-form liquid-form" role="search">

                    <div class="liquid-group">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                        <input type="search" id="landlordSearch" name="landlordSearch" class="liquid-input"
                            placeholder="Search landlords..." aria-label="Search landlords">
                    </div>

                    <select id="verificationStatus" name="verificationStatus" class="liquid-input"
                        aria-label="Filter by status">
                        <option value="">All Status</option>
                        <option value="Verified">Active</option>
                        <option value="Pending">Pending</option>
                        <option value="Suspended">Suspended</option>
                    </select>

                    <select id="propertyFilter" name="propertyFilter" class="liquid-input"
                        aria-label="Filter by properties">
                        <option value="">All Properties</option>
                        <option value="with">With properties</option>
                        <option value="without">No properties yet</option>
                    </select>

                    <button type="button" id="resetLandlordFilters" class="btn btn-outline btn-sm">Reset</button>

                </form>

                <!-- Table -->

                <div class="table-wrapper">

                    <table class="admin-table">

                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Properties</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="landlordTableBody"></tbody>

                    </table>

                </div>

                <div id="landlordPagination" class="pagination"></div>

                <!-- Empty State -->

                <div id="noLandlordsFound" class="empty-state hidden">

                    <i class="fa-solid fa-building-circle-xmark" aria-hidden="true"></i>

                    <h3>No Landlords Found</h3>

                    <p>No landlord matches your current search or filter.</p>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <div id="footer"></div>

    <!-- JavaScript -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

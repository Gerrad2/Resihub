<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         Basic Meta Information
    =========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Broadcast Messages | ResiHub</title>

    <meta name="description"
        content="Create and manage platform-wide announcements and notifications for students and landlords on the ResiHub Administration Panel.">

    <meta name="keywords" content="ResiHub, Broadcast Messages, Notifications, Announcements, Admin Dashboard">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_broadcast_messages.htm">

    <!-- ==========================================
         Open Graph
    =========================================== -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Admin Broadcast Messages | ResiHub">

    <meta property="og:description" content="Create, schedule and manage platform announcements and notifications.">

    <meta property="og:url" content="https://www.resihub.com/admin_broadcast_messages.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Twitter
    =========================================== -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Admin Broadcast Messages | ResiHub">

    <meta name="twitter:description" content="Administrator broadcast and notification management.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Favicon
    =========================================== -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         Master Stylesheet
    =========================================== -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body data-resihub-surface="admin">

    <!-- ==========================================
         Scroll Progress
    =========================================== -->

    <div id="scrollProgress"></div>

    <!-- ==========================================
         Floating Background Shapes
    =========================================== -->

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <!-- ==========================================
         Header
    =========================================== -->

    <div id="header"></div>

    <!-- ==========================================
         Main Content
    =========================================== -->

    <main id="mainContent">

        <section id="broadcastMessagesContent" class="page-section">

            <div class="page-container">

                <!-- Heading -->

                <header class="dashboard-heading">
                    <div>
                        <h1>Broadcast Messages</h1>
                        <p>Send announcements and notifications to users.</p>
                    </div>
                    <button type="button" id="newBroadcastBtn" class="btn btn-primary">
                        <i class="fa-solid fa-bullhorn" aria-hidden="true"></i> New Message
                    </button>
                </header>

                <!-- Key figures -->

                <section class="statistics-section" aria-label="Broadcast figures">
                    <div class="statistics-grid">

                        <article class="statistics-card glass-card">
                            <div class="card-icon card-icon-cyan"><i class="fa-solid fa-paper-plane"
                                    aria-hidden="true"></i></div>
                            <div class="card-content">
                                <p class="card-label">Messages Sent</p>
                                <h2 id="messagesSent"></h2>
                            </div>
                        </article>

                        <article class="statistics-card glass-card">
                            <div class="card-icon card-icon-indigo"><i class="fa-solid fa-users" aria-hidden="true"></i>
                            </div>
                            <div class="card-content">
                                <p class="card-label">Total Recipients</p>
                                <h2 id="totalRecipients"></h2>
                            </div>
                        </article>

                        <article class="statistics-card glass-card">
                            <div class="card-icon card-icon-teal"><i class="fa-solid fa-calendar-days"
                                    aria-hidden="true"></i></div>
                            <div class="card-content">
                                <p class="card-label">Sent This Month</p>
                                <h2 id="activeAnnouncements"></h2>
                            </div>
                        </article>

                        <!-- Scheduling is not supported yet, so this card is hidden -->
                        <article class="statistics-card glass-card">
                            <div class="card-icon card-icon-blue"><i class="fa-solid fa-calendar-check"
                                    aria-hidden="true"></i></div>
                            <div class="card-content">
                                <p class="card-label">Scheduled</p>
                                <h2 id="scheduledMessages"></h2>
                            </div>
                        </article>

                    </div>
                </section>

                <!-- Compose -->

                <form id="broadcastForm" class="broadcast-compose glass-card" autocomplete="off">

                    <input type="text" id="broadcastTitle" name="broadcastTitle" class="liquid-input"
                        placeholder="Message title" aria-label="Message title" maxlength="120" required>

                    <select id="broadcastAudience" name="broadcastAudience" class="liquid-input" aria-label="Audience">
                        <option value="all">All Users</option>
                        <option value="students">Students</option>
                        <option value="landlords">Landlords</option>
                        <option value="administrators">Administrators</option>
                    </select>

                    <textarea id="broadcastMessage" name="broadcastMessage" class="liquid-input"
                        placeholder="Write your message..." aria-label="Message" maxlength="2000" required></textarea>

                    <input type="datetime-local" id="broadcastSendAt" name="broadcastSendAt" class="liquid-input"
                        aria-label="Schedule date and time">

                    <div id="broadcastPreview" class="hidden" aria-live="polite">
                        <p id="broadcastPreviewAudience"></p>
                        <h3 id="broadcastPreviewTitle"></h3>
                        <p id="broadcastPreviewBody"></p>
                        <button type="button" id="closeBroadcastPreview" class="icon-btn" aria-label="Close preview">
                            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                        </button>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="previewBroadcastBtn" class="btn btn-outline">
                            <i class="fa-solid fa-eye" aria-hidden="true"></i> Preview
                        </button>
                        <button type="button" id="scheduleBroadcastBtn" class="btn btn-outline">
                            <i class="fa-solid fa-calendar-days" aria-hidden="true"></i> Schedule
                        </button>
                        <button type="submit" id="sendBroadcastBtn" class="btn btn-primary">
                            <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Send now
                        </button>
                    </div>

                </form>

                <!-- History -->

                <div class="table-wrapper">

                    <table class="admin-table">

                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Audience</th>
                                <th>Sent</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="broadcastHistory"></tbody>

                    </table>

                </div>

                <!-- Empty State -->

                <div id="noBroadcastsFound" class="empty-state hidden">

                    <i class="fa-solid fa-bullhorn" aria-hidden="true"></i>

                    <h3>No Messages Yet</h3>

                    <p>Messages you send to users will appear here.</p>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <div id="footer"></div>

    <!-- JavaScript -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         Basic Meta Information
    =========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Backup & Restore | ResiHub</title>

    <meta name="description"
        content="Manage system backups, restore points and disaster recovery for the ResiHub platform.">

    <meta name="keywords" content="ResiHub, Backup, Restore, Recovery, Administrator">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_backup_restore.htm">

    <!-- ==========================================
         Open Graph
    =========================================== -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Admin Backup & Restore | ResiHub">

    <meta property="og:description" content="Protect ResiHub data with automated backups and recovery tools.">

    <meta property="og:url" content="https://www.resihub.com/admin_backup_restore.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Twitter
    =========================================== -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Admin Backup & Restore | ResiHub">

    <meta name="twitter:description" content="Administrator backup management.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Favicon
    =========================================== -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         Master Stylesheet
    =========================================== -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body data-resihub-surface="admin">

    <!-- ==========================================
         Scroll Progress
    =========================================== -->

    <div id="scrollProgress"></div>

    <!-- ==========================================
         Floating Background Shapes
    =========================================== -->

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <!-- ==========================================
         Header
    =========================================== -->

    <div id="header"></div>

    <!-- ==========================================
         Main Content
    =========================================== -->

    <main id="mainContent" class="page-transition">

        <section id="backupRestoreContent" class="page-section">

            <div class="container page-container">

                <!-- ==========================================
                     Page Header
                =========================================== -->

                <header class="section-header">

                    <div class="container">

                        <header class="auth-hero reveal fade-up">

                            <div id="hero-text">

                                <span class="page-badge floating-badge glass-card">

                                    <i class="fa-solid fa-database"></i>

                                    Backup & Restore

                                </span>

                                <h1>System Backup Management</h1>

                                <p>

                                    Create backups, schedule automatic backups and restore
                                    the ResiHub platform whenever necessary.

                                </p>

                        </header>

                        <!-- ==========================================
                     Quick Actions
                =========================================== -->

                        <div class="action-buttons">

                            <button id="createBackupBtn" class="btn btn-primary azure-sweep ripple">

                                <i class="fa-solid fa-hard-drive"></i>

                                <span>Create Backup</span>

                            </button>

                            <button id="restoreBackupBtn" class="btn btn-primary azure-sweep ripple">

                                <i class="fa-solid fa-clock-rotate-left"></i>

                                <span>Restore Backup</span>

                            </button>

                        </div>

                        <!-- ==========================================
                     Statistics
                =========================================== -->

                        <section class="dashboard-section statistics-section glass-reveal">

                            <div class="dashboard-grid statistics-grid">

                                <article class="dashboard-card statistics-card floating-card glass-card">

                                    <div class="card-icon">

                                        <i class="fa-solid fa-server"></i>

                                    </div>

                                    <div class="card-content">

                                        <h3 id="backupCount" class="count-up">0</h3>

                                        <p>Total Backups</p>

                                    </div>

                                </article>

                                <article class="dashboard-card statistics-card floating-card glass-card">

                                    <div class="card-icon">

                                        <i class="fa-solid fa-clock"></i>

                                    </div>

                                    <div class="card-content">

                                        <h3 id="lastBackupTime">--</h3>

                                        <p>Last Backup</p>

                                    </div>

                                </article>

                                <article class="dashboard-card statistics-card floating-card glass-card">

                                    <div class="card-icon">

                                        <i class="fa-solid fa-memory"></i>

                                    </div>

                                    <div class="card-content">

                                        <h3 id="backupStorage">0 GB</h3>

                                        <p>Storage Used</p>

                                    </div>

                                </article>

                                <article class="dashboard-card statistics-card floating-card glass-card">

                                    <div class="card-icon">

                                        <i class="fa-solid fa-arrows-rotate"></i>

                                    </div>

                                    <div class="card-content">

                                        <h3 id="autoBackupStatus">

                                            Enabled

                                        </h3>

                                        <p>Automatic Backup</p>

                                    </div>

                                </article>

                            </div>

                        </section>

                        <!-- ==========================================
                     Backup Settings
                =========================================== -->

                        <section class="dashboard-section glass-card">

                            <header class="section-header">

                                <h2>Automatic Backup Settings</h2>

                            </header>

                            <form id="backupSettingsForm" class="filter-form liquid-form">

                                <div class="liquid-group">

                                    <label for="backupFrequency">

                                        Backup Frequency

                                    </label>

                                    <select id="backupFrequency" class="liquid-input">

                                        <option>Hourly</option>

                                        <option>Daily</option>

                                        <option>Weekly</option>

                                        <option>Monthly</option>

                                    </select>

                                </div>

                                <div class="liquid-group">

                                    <label for="retentionPeriod">

                                        Retention Period

                                    </label>

                                    <select id="retentionPeriod" class="liquid-input">

                                        <option>7 Days</option>

                                        <option>30 Days</option>

                                        <option>90 Days</option>

                                        <option>1 Year</option>

                                    </select>

                                </div>

                                <label class="switch">

                                    <input type="checkbox" id="autoBackupToggle" checked>

                                    <span>

                                        Enable Automatic Backups

                                    </span>

                                </label>

                            </form>

                        </section>

                        <!-- ==========================================
                     Backup History
                =========================================== -->

                        <section class="table-section glass-reveal">

                            <div class="table-responsive">

                                <table class="admin-table data-table">

                                    <thead>

                                        <tr>

                                            <th>Date</th>

                                            <th>Backup Name</th>

                                            <th>Type</th>

                                            <th>Size</th>

                                            <th>Status</th>

                                            <th>Actions</th>

                                        </tr>

                                    </thead>

                                    <tbody id="backupHistoryTable">

                                        <!-- JavaScript loads backup history -->

                                    </tbody>

                                </table>

                            </div>

                        </section>

                    </div>

        </section>

    </main>

    <!-- ==========================================
         Footer
    =========================================== -->

    <div id="footer"></div>

    <!-- ==========================================
         JavaScript Modules
    =========================================== -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

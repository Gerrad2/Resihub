<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         Character Encoding
    =========================================== -->
    <meta charset="UTF-8">

    <!-- ==========================================
         Responsive Design
    =========================================== -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ==========================================
         Basic SEO
    =========================================== -->
    <title>Manage Students | ResiHub Admin</title>

    <meta name="description"
        content="Manage registered students, verify accounts, suspend users, and monitor student activity from the ResiHub Administrator Panel.">

    <meta name="keywords" content="ResiHub, Admin, Students, Student Management, University Accommodation, Dashboard">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_students.htm">

    <!-- ==========================================
         Open Graph
    =========================================== -->
    <meta property="og:type" content="website">

    <meta property="og:title" content="Manage Students | ResiHub Admin">

    <meta property="og:description"
        content="Manage student accounts, approvals, suspensions and activities from the ResiHub Administration Panel.">

    <meta property="og:url" content="https://www.resihub.com/admin_students.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Twitter Card
    =========================================== -->
    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Manage Students | ResiHub Admin">

    <meta name="twitter:description" content="Manage student accounts and activities on ResiHub.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Favicon
    =========================================== -->
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         Font Awesome Icons
    =========================================== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ==========================================
         Global Stylesheet
    =========================================== -->
    <link rel="stylesheet" href="../styles/style.css">

</head>

<body data-resihub-surface="admin">

    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <!-- HEADER / NAVIGATION -->

    <div id="header"></div>

    <main>

        <!-- Student Management -->

        <section id="admin-student-content" class="page-section">

            <div class="container">

                <div class="page-heading">
                    <h1>Students</h1>
                    <p>Manage student accounts and registrations.</p>
                </div>

                <!-- Filters -->

                <form id="studentFilterForm" class="filter-form liquid-form" role="search">

                    <input type="search" id="studentSearch" name="studentSearch" class="liquid-input"
                        placeholder="Search students..." aria-label="Search students">

                    <select id="studentStatus" name="studentStatus" class="liquid-input" aria-label="Filter by status">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="suspended">Suspended</option>
                        <option value="pending">Pending</option>
                    </select>

                    <select id="studentCourse" name="studentCourse" class="liquid-input" aria-label="Filter by course">
                        <option value="">All Courses</option>
                    </select>

                </form>

                <!-- Table -->

                <div class="table-wrapper">

                    <table class="admin-table data-table">

                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Course</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="studentTableBody"></tbody>

                    </table>

                </div>

                <p id="studentCount" class="table-count" aria-live="polite"></p>

                <div id="studentPagination" class="pagination"></div>

                <!-- Empty State -->

                <div id="noStudentsFound" class="empty-state hidden">

                    <i class="fa-solid fa-users-slash"></i>

                    <h3>No Students Found</h3>

                    <p>No student matches your current search or filter.</p>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <div id="footer"></div>

    <!-- JavaScript -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         Basic Meta Information
    =========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Listings | ResiHub Admin</title>

    <meta name="description"
        content="Manage property listings on the ResiHub Administration Panel. Approve, reject, feature, suspend and monitor accommodation listings across Nigeria.">

    <meta name="keywords" content="ResiHub, Admin, Listings, Student Accommodation, Property Management, Dashboard">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_listings.htm">

    <!-- ==========================================
         Open Graph
    =========================================== -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Manage Listings | ResiHub Admin">

    <meta property="og:description" content="Manage and moderate accommodation listings on ResiHub.">

    <meta property="og:url" content="https://www.resihub.com/admin_listings.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Twitter
    =========================================== -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Manage Listings | ResiHub Admin">

    <meta name="twitter:description" content="Approve, reject, feature and manage accommodation listings on ResiHub.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Favicon
    =========================================== -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         Master Stylesheet
    =========================================== -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body data-resihub-surface="admin">

    <!-- ==========================================
         Scroll Progress
    =========================================== -->

    <div id="scrollProgress"></div>

    <!-- ==========================================
         Floating Background Shapes
    =========================================== -->

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <!-- ==========================================
         Header
    =========================================== -->

    <div id="header"></div>

    <!-- ==========================================
         Main Content
    =========================================== -->

    <main id="mainContent">

        <section id="adminListingsContent" class="page-section">

            <div class="page-container">

                <!-- Heading -->

                <header class="dashboard-heading">
                    <div>
                        <h1>Listings</h1>
                        <p>Review and manage property listings.</p>
                    </div>
                </header>

                <!-- Key figures -->

                <section class="statistics-section" aria-label="Listing figures">
                    <div class="statistics-grid">

                        <article class="statistics-card glass-card">
                            <div class="card-icon card-icon-cyan"><i class="fa-solid fa-house" aria-hidden="true"></i>
                            </div>
                            <div class="card-content">
                                <p class="card-label">Total Listings</p>
                                <h2 id="totalListings"></h2>
                            </div>
                        </article>

                        <article class="statistics-card glass-card">
                            <div class="card-icon card-icon-teal"><i class="fa-solid fa-circle-check"
                                    aria-hidden="true"></i></div>
                            <div class="card-content">
                                <p class="card-label">Approved</p>
                                <h2 id="approvedListings"></h2>
                            </div>
                        </article>

                        <article class="statistics-card glass-card">
                            <div class="card-icon card-icon-indigo"><i class="fa-solid fa-clock" aria-hidden="true"></i>
                            </div>
                            <div class="card-content">
                                <p class="card-label">Pending Review</p>
                                <h2 id="pendingListings"></h2>
                            </div>
                        </article>

                        <article class="statistics-card glass-card">
                            <div class="card-icon card-icon-blue"><i class="fa-solid fa-star" aria-hidden="true"></i>
                            </div>
                            <div class="card-content">
                                <p class="card-label">Featured</p>
                                <h2 id="featuredListings"></h2>
                            </div>
                        </article>

                    </div>
                </section>

                <!-- Filters -->

                <form id="listingFilterForm" class="filter-form liquid-form" role="search">

                    <div class="liquid-group">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                        <input type="search" id="listingSearch" name="listingSearch" class="liquid-input"
                            placeholder="Search listings..." aria-label="Search listings">
                    </div>

                    <select id="listingStatus" name="listingStatus" class="liquid-input" aria-label="Filter by status">
                        <option value="">All Status</option>
                        <option value="Approved">Approved</option>
                        <option value="Pending">Pending</option>
                        <option value="Featured">Featured</option>
                        <option value="Suspended">Suspended</option>
                    </select>

                    <select id="propertyType" name="propertyType" class="liquid-input"
                        aria-label="Filter by property type">
                        <option value="">All Types</option>
                        <option value="Self Contain">Self Contain</option>
                        <option value="Single Room">Single Room</option>
                        <option value="Room and Parlour">Room &amp; Parlour</option>
                        <option value="Flat">Flat</option>
                        <option value="Hostel">Hostel</option>
                    </select>

                    <select id="listingState" name="listingState" class="liquid-input" aria-label="Filter by state">
                        <option value="">All States</option>
                    </select>

                </form>

                <!-- Table -->

                <div class="table-wrapper">

                    <table class="admin-table">

                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Title</th>
                                <th>Location</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="listingTableBody"></tbody>

                    </table>

                </div>

                <div id="listingPagination" class="pagination"></div>

                <!-- Empty State -->

                <div id="noListingsFound" class="empty-state hidden">

                    <i class="fa-solid fa-house-circle-xmark" aria-hidden="true"></i>

                    <h3>No Listings Found</h3>

                    <p>No listing matches your current search or filter.</p>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <div id="footer"></div>

    <!-- JavaScript -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

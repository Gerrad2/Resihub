<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         Basic Meta Information
    =========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Bookings | ResiHub Admin</title>

    <meta name="description"
        content="Monitor and manage all booking and inspection requests on the ResiHub Administration Panel.">

    <meta name="keywords" content="ResiHub, Admin, Booking Requests, Inspection Requests, Student Accommodation">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_bookings.htm">

    <!-- ==========================================
         Open Graph
    =========================================== -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Manage Bookings | ResiHub Admin">

    <meta property="og:description"
        content="Manage inspection requests and booking activities across the ResiHub platform.">

    <meta property="og:url" content="https://www.resihub.com/admin_bookings.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Twitter
    =========================================== -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Manage Bookings | ResiHub Admin">

    <meta name="twitter:description" content="Review and manage all student booking requests on ResiHub.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Favicon
    =========================================== -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         Master Stylesheet
    =========================================== -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body data-resihub-surface="admin">

    <!-- ==========================================
         Scroll Progress
    =========================================== -->

    <div id="scrollProgress"></div>

    <!-- ==========================================
         Floating Background Shapes
    =========================================== -->

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <!-- ==========================================
         Header
    =========================================== -->

    <div id="header"></div>

    <!-- ==========================================
         Main Content
    =========================================== -->

    <main>

        <!-- Bookings -->

        <section id="adminBookingsContent" class="page-section">

            <div class="container">

                <div class="page-heading">
                    <h1>Bookings</h1>
                    <p>Manage and track all property bookings.</p>
                </div>

                <!-- Filters -->

                <form id="bookingFilterForm" class="filter-form liquid-form" role="search">

                    <select id="bookingStatus" class="liquid-input" aria-label="Filter by status">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Confirmed</option>
                        <option value="completed">Completed</option>
                        <option value="rejected">Rejected</option>
                        <option value="cancelled">Cancelled</option>
                    </select>

                    <select id="bookingDateRange" class="liquid-input" aria-label="Filter by date range">
                        <option value="">All Dates</option>
                        <option value="7">Last 7 days</option>
                        <option value="30">Last 30 days</option>
                        <option value="90">Last 90 days</option>
                    </select>

                    <div class="liquid-group">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                        <input type="search" id="bookingSearch" name="bookingSearch" class="liquid-input"
                            placeholder="Search booking..." aria-label="Search bookings">
                    </div>

                </form>

                <!-- Table -->

                <div class="table-wrapper">

                    <table class="admin-table">

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Property</th>
                                <th>Student</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="bookingTableBody"></tbody>

                    </table>

                </div>

                <div id="bookingPagination" class="pagination"></div>

                <!-- Empty State -->

                <div id="noBookingsFound" class="empty-state hidden">

                    <i class="fa-solid fa-calendar-xmark"></i>

                    <h3>No Bookings Found</h3>

                    <p>No booking matches your current search or filter.</p>

                </div>

            </div>

        </section>

    </main>

    <!-- Booking details (read-only) -->

    <div id="bookingModal" class="modal hidden" aria-hidden="true">

        <div class="modal-content">

            <div class="modal-header">
                <h2 class="modal-title">Booking details</h2>
                <button type="button" id="closeBookingModal" class="modal-close" aria-label="Close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="modal-body" id="bookingDetails"></div>

        </div>

    </div>

    <!-- FOOTER -->

    <div id="footer"></div>

    <!-- JavaScript -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

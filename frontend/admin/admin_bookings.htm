<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         Basic Meta Information
    =========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Bookings | ResiHub Admin</title>

    <meta name="description"
        content="Monitor and manage all booking and inspection requests on the ResiHub Administration Panel.">

    <meta name="keywords" content="ResiHub, Admin, Booking Requests, Inspection Requests, Student Accommodation">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_bookings.htm">

    <!-- ==========================================
         Open Graph
    =========================================== -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Manage Bookings | ResiHub Admin">

    <meta property="og:description"
        content="Manage inspection requests and booking activities across the ResiHub platform.">

    <meta property="og:url" content="https://www.resihub.com/admin_bookings.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Twitter
    =========================================== -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Manage Bookings | ResiHub Admin">

    <meta name="twitter:description" content="Review and manage all student booking requests on ResiHub.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Favicon
    =========================================== -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         Master Stylesheet
    =========================================== -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body data-resihub-surface="admin">

    <!-- ==========================================
         Scroll Progress
    =========================================== -->

    <div id="scrollProgress"></div>

    <!-- ==========================================
         Floating Background Shapes
    =========================================== -->

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <!-- ==========================================
         Header
    =========================================== -->

    <div id="header"></div>

    <!-- ==========================================
         Main Content
    =========================================== -->

    <main id="mainContent" class="page-transition">

        <section id="adminBookingsContent" class="page-section glass-reveal floating-section">

            <div class="container page-container">

                <!-- ==========================================
                     Page Header
                =========================================== -->

                <header class="section-header">

                    <div class="container">

                        <header class="auth-hero reveal fade-up">

                            <div id="hero-text">

                                <span class="page-badge floating-badge glass-card">

                                    <i class="fa-solid fa-calendar-check"></i>

                                    Booking Management

                                </span>

                                <h1>Manage Booking Requests</h1>

                                <p>

                                    Monitor inspection requests, bookings, approvals and completed
                                    reservations across the ResiHub platform.

                                </p>

                        </header>

                        <!-- ==========================================
                     Dashboard Statistics
                =========================================== -->

                        <section class="dashboard-section statistics-section glass-reveal">

                            <div class="dashboard-grid statistics-grid">

                                <article class="dashboard-card statistics-card floating-card glass-card">

                                    <div class="card-icon">

                                        <i class="fa-solid fa-calendar-check"></i>

                                    </div>

                                    <div class="card-content">

                                        <h2 id="totalBookings" class="count-up">0</h2>

                                        <p>Total Bookings</p>

                                    </div>

                                </article>

                                <article class="dashboard-card statistics-card floating-card glass-card">

                                    <div class="card-icon">

                                        <i class="fa-solid fa-hourglass-half"></i>

                                    </div>

                                    <div class="card-content">

                                        <h2 id="pendingBookings" class="count-up">0</h2>

                                        <p>Pending</p>

                                    </div>

                                </article>

                                <article class="dashboard-card statistics-card floating-card glass-card">

                                    <div class="card-icon">

                                        <i class="fa-solid fa-circle-check"></i>

                                    </div>

                                    <div class="card-content">

                                        <h2 id="approvedBookings" class="count-up">0</h2>

                                        <p>Approved</p>

                                    </div>

                                </article>

                                <article class="dashboard-card statistics-card floating-card glass-card">

                                    <div class="card-icon">

                                        <i class="fa-solid fa-circle-xmark"></i>

                                    </div>

                                    <div class="card-content">

                                        <h2 id="rejectedBookings" class="count-up">0</h2>

                                        <p>Rejected</p>

                                    </div>

                                </article>

                            </div>

                        </section>

                        <!-- ==========================================
                     Booking Filters
                =========================================== -->

                        <section class="filter-section glass-card">

                            <form id="bookingFilterForm" class="filter-form liquid-form">

                                <div class="liquid-group">

                                    <input type="search" id="bookingSearch" class="liquid-input"
                                        placeholder="Search by student, landlord or property..." autocomplete="off">

                                </div>

                                <div class="liquid-group">

                                    <select id="bookingStatus" class="liquid-input">

                                        <option value="">All Status</option>

                                        <option value="Pending">Pending</option>

                                        <option value="Approved">Approved</option>

                                        <option value="Rejected">Rejected</option>

                                        <option value="Completed">Completed</option>

                                    </select>

                                </div>

                                <div class="liquid-group">

                                    <select id="bookingSort" class="liquid-input">

                                        <option value="latest">Latest First</option>

                                        <option value="oldest">Oldest First</option>

                                        <option value="student">Student Name</option>

                                        <option value="landlord">Landlord Name</option>

                                    </select>

                                </div>

                                <button type="submit" class="btn btn-primary azure-sweep ripple">

                                    <i class="fa-solid fa-filter"></i>

                                    <span>Apply</span>

                                </button>

                            </form>

                        </section>

                        <!-- ==========================================
                     Booking Table
                =========================================== -->

                        <section class="table-section glass-reveal">

                            <div class="table-responsive">

                                <table class="admin-table data-table">

                                    <thead>

                                        <tr>

                                            <th>ID</th>

                                            <th>Student</th>

                                            <th>Landlord</th>

                                            <th>Property</th>

                                            <th>Date</th>

                                            <th>Status</th>

                                            <th>Actions</th>

                                        </tr>

                                    </thead>

                                    <tbody id="bookingTableBody">

                                        <!-- Loaded dynamically -->

                                    </tbody>

                                </table>

                            </div>

                        </section>

                        <!-- ==========================================
                     Booking Details Modal
                =========================================== -->

                        <div id="bookingModal" class="modal hidden">

                            <div class="modal-content glass-card">

                                <button id="closeBookingModal" class="modal-close" aria-label="Close">

                                    <i class="fa-solid fa-xmark"></i>

                                </button>

                                <h2>Booking Details</h2>

                                <div id="bookingDetails">

                                    <!-- Loaded dynamically -->

                                </div>

                                <div class="modal-actions">

                                    <button id="approveBooking" class="btn btn-primary azure-sweep ripple">

                                        <i class="fa-solid fa-circle-check"></i>

                                        Approve

                                    </button>

                                    <button id="rejectBooking" class="btn btn-outline">

                                        <i class="fa-solid fa-circle-xmark"></i>

                                        Reject

                                    </button>

                                </div>

                            </div>

                        </div>

                        <!-- ==========================================
                     Pagination
                =========================================== -->

                        <section class="pagination-section">

                            <div id="bookingPagination" class="pagination">

                            </div>

                        </section>

                    </div>

        </section>

    </main>

    <!-- ==========================================
         Footer
    =========================================== -->

    <div id="footer"></div>

    <!-- ==========================================
         JavaScript
    =========================================== -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

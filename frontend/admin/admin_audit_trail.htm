<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         Basic Meta Information
    =========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Audit Trail | ResiHub</title>

    <meta name="description"
        content="Monitor security events, administrator audits and sensitive platform changes across the ResiHub platform.">

    <meta name="keywords" content="ResiHub, Audit Trail, Security, Administrator, Audit Logs, Activity Logs">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_audit_trail.htm">

    <!-- ==========================================
         Open Graph
    =========================================== -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Admin Audit Trail | ResiHub">

    <meta property="og:description"
        content="Track administrator security events, sensitive activities and audit logs on ResiHub.">

    <meta property="og:url" content="https://www.resihub.com/admin_audit_trail.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Twitter
    =========================================== -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Admin Audit Trail | ResiHub">

    <meta name="twitter:description" content="Monitor administrator security activities and audit logs.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Favicon
    =========================================== -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         Master Stylesheet
    =========================================== -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body data-resihub-surface="admin">

    <!-- ==========================================
         Scroll Progress
    =========================================== -->

    <div id="scrollProgress"></div>

    <!-- ==========================================
         Floating Background Shapes
    =========================================== -->

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <!-- ==========================================
         Header
    =========================================== -->

    <div id="header"></div>

    <!-- ==========================================
         Main Content
    =========================================== -->

    <main id="mainContent">

        <section id="auditTrailContent" class="page-section">

            <div class="page-container">

                <!-- Heading -->

                <header class="dashboard-heading" id="hero-text">
                    <div>
                        <h1>Audit Trail</h1>
                        <p>Track sensitive actions and system changes.</p>
                    </div>
                    <button type="button" id="exportAuditBtn" class="btn btn-outline">
                        <i class="fa-solid fa-file-export" aria-hidden="true"></i> Export
                    </button>
                </header>

                <!-- Filters -->

                <form id="auditFilterForm" class="audit-filters glass-card" role="search">

                    <input type="date" id="auditDate" name="auditDate" class="liquid-input" aria-label="Filter by day">

                    <select id="auditEvent" name="auditEvent" class="liquid-input" aria-label="Filter by module">
                        <option value="">All Modules</option>
                        <option value="listing">Listings</option>
                        <option value="booking">Bookings</option>
                        <option value="verification">Verification</option>
                        <option value="broadcast">Broadcasts</option>
                        <option value="settings">Settings</option>
                        <option value="admin_session">Sessions</option>
                    </select>

                    <select id="auditSeverity" name="auditSeverity" class="liquid-input" aria-label="Filter by user">
                        <option value="">All Users</option>
                    </select>

                    <input type="search" id="auditSearch" name="auditSearch" class="liquid-input"
                        placeholder="Search audit trail..." aria-label="Search audit trail">

                </form>

                <!-- Table -->

                <div class="table-wrapper">

                    <table class="admin-table audit-table">

                        <thead>
                            <tr>
                                <th>Date &amp; Time</th>
                                <th>User</th>
                                <th>Action</th>
                                <th>Module</th>
                                <th>IP Address</th>
                            </tr>
                        </thead>

                        <tbody id="auditTrailTable"></tbody>

                    </table>

                </div>

                <div id="auditPagination" class="pagination"></div>

                <!-- Empty State -->

                <div id="auditEmptyState" class="empty-state hidden">

                    <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>

                    <h3>No Entries Found</h3>

                    <p>No audit entry matches your current filter.</p>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <div id="footer"></div>

    <!-- JavaScript -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

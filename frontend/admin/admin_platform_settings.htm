    <meta property="og:title" content="Platform Settings | ResiHub Admin">

    <meta property="og:description"
        content="Configure branding, integrations, security and platform settings for ResiHub.">

    <meta property="og:url" content="https://www.resihub.com/admin_platform_settings.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Twitter Card
    =========================================== -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Platform Settings | ResiHub Admin">

    =========================================== -->

    <link rel="stylesheet" href="../styles/style.css">

<body data-resihub-surface="admin">

    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <!-- ==========================================
         Dynamic Header
    =========================================== -->

    <div id="header"></div>

    <!-- ==========================================
         Main Content
    =========================================== -->

    <main id="mainContent" class="page-transition">

        <!-- ==========================================
             Breadcrumb
        =========================================== -->

        <section class="breadcrumb">

            <a href="admin_dashboard.htm">

                Dashboard

            </a>

            <span>/</span>

            <span>

                Platform Settings

            </span>

        </section>

        <!-- ==========================================
             Page Header
        =========================================== -->

        <section class="page-header glass-reveal">

            <div class="page-header-content">

                <span class="page-badge floating-badge glass-card">

                    <i class="fa-solid fa-sliders"></i>

                    Platform Settings

                </span>

                <h1>

                    Platform Configuration

                </h1>

                <p>

                    Configure branding, communication,
                    integrations, security and platform
                    preferences from one centralized location.

                </p>

            </div>

            <div class="page-header-actions">

                <button class="btn btn-outline">

                    <i class="fa-solid fa-rotate-left"></i>

                    Reset

                </button>

                <button class="btn btn-primary azure-sweep ripple">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Changes

                </button>

            </div>

        </section>

        <!-- ==========================================
             Platform Overview
        =========================================== -->

        <section class="dashboard-section statistics-section glass-reveal">

            <div class="dashboard-grid statistics-grid">

                <article class="dashboard-card statistics-card floating-card glass-card">

                    <div class="card-icon">

                        <i class="fa-solid fa-circle-check"></i>

                    </div>

                    <div class="card-content">

                        <h3>

                            Online

                        </h3>

                        <p>

                            Platform Status

                        </p>

                    </div>

                </article>

                <article class="dashboard-card statistics-card floating-card glass-card">

                    <div class="card-icon">

                        <i class="fa-solid fa-code-branch"></i>

                    </div>

                    <div class="card-content">

                        <h3>

                            v1.0.0

                        </h3>

                        <p>

                            Current Version

                        </p>

                    </div>

                </article>

                <article class="dashboard-card statistics-card floating-card glass-card">

                    <div class="card-icon">

                        <i class="fa-solid fa-clock"></i>

                    </div>

                    <div class="card-content">

                        <h3>

                            Today

                        </h3>

                        <p>

                            Last Backup

                        </p>

                    </div>

                </article>

                <article class="dashboard-card statistics-card floating-card glass-card">

                    <div class="card-icon">

                        <i class="fa-solid fa-user-shield"></i>

                    </div>

                    <div class="card-content">

                        <h3>

                            Administrator

                        </h3>

                        <p>

                            Last Updated By

                        </p>

                    </div>

                </article>

            </div>

        </section>

        <!-- ==========================================
             Settings Content Placeholder
        =========================================== -->

        <section id="platformSettingsContent" class="page-section glass-reveal floating-section">

            <div class="container page-container">

                <!-- Platform settings modules
                     will be added here -->

            </div>

        </section>

    </main>
    <!-- ==========================
     Footer
========================== -->

    <div id="footer"></div>

    <!-- ==========================
     JavaScript Modules
========================== -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

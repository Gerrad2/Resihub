<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         Character Encoding
    =========================================== -->
    <meta charset="UTF-8">

    <!-- ==========================================
         Responsive Viewport
    =========================================== -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ==========================================
         Basic SEO
    =========================================== -->
    <title>Admin Support Tickets | ResiHub</title>

    <meta name="description"
        content="Manage support tickets submitted by students and landlords across the ResiHub platform.">

    <meta name="keywords" content="ResiHub, Support Tickets, Help Desk, Administrator">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_support_tickets.htm">

    <!-- ==========================================
         Open Graph
    =========================================== -->
    <meta property="og:type" content="website">

    <meta property="og:title" content="Admin Support Tickets | ResiHub">

    <meta property="og:description" content="Manage platform support requests.">

    <meta property="og:url" content="https://www.resihub.com/admin_support_tickets.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Twitter Card
    =========================================== -->
    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Admin Support Tickets | ResiHub">

    <meta name="twitter:description" content="Administrator support center.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Favicon
    =========================================== -->
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         Font Awesome Icons
    =========================================== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ==========================================
         Global Stylesheet
    =========================================== -->
    <link rel="stylesheet" href="../styles/style.css">

</head>

<body data-resihub-surface="admin">

    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <!-- ==========================================
         Dynamic Admin Header
    =========================================== -->

    <div id="header"></div>

    <main id="mainContent">

        <section id="supportTicketsContent" class="page-section">

            <div class="page-container">

                <!-- Heading -->

                <header class="dashboard-heading">
                    <div>
                        <h1>Support Tickets</h1>
                        <p>Track and resolve user support requests.</p>
                    </div>
                </header>

                <!-- Key figures -->

                <section class="statistics-section" aria-label="Ticket figures">
                    <div class="statistics-grid">

                        <article class="statistics-card glass-card">
                            <div class="card-icon card-icon-cyan"><i class="fa-solid fa-ticket" aria-hidden="true"></i>
                            </div>
                            <div class="card-content">
                                <p class="card-label">Total Tickets</p>
                                <h2 id="totalTickets"></h2>
                            </div>
                        </article>

                        <article class="statistics-card glass-card">
                            <div class="card-icon card-icon-blue"><i class="fa-solid fa-envelope-open"
                                    aria-hidden="true"></i></div>
                            <div class="card-content">
                                <p class="card-label">Open</p>
                                <h2 id="openTickets"></h2>
                            </div>
                        </article>

                        <article class="statistics-card glass-card">
                            <div class="card-icon card-icon-indigo"><i class="fa-solid fa-clock" aria-hidden="true"></i>
                            </div>
                            <div class="card-content">
                                <p class="card-label">Pending</p>
                                <h2 id="pendingTickets"></h2>
                            </div>
                        </article>

                        <article class="statistics-card glass-card">
                            <div class="card-icon card-icon-teal"><i class="fa-solid fa-circle-check"
                                    aria-hidden="true"></i></div>
                            <div class="card-content">
                                <p class="card-label">Resolved</p>
                                <h2 id="resolvedTickets"></h2>
                            </div>
                        </article>

                    </div>
                </section>

                <!-- Filters -->

                <form id="ticketFilterForm" class="filter-form liquid-form" role="search">

                    <div class="liquid-group">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                        <input type="search" id="ticketSearch" name="ticketSearch" class="liquid-input"
                            placeholder="Search tickets..." aria-label="Search tickets">
                    </div>

                    <select id="ticketPriority" name="ticketPriority" class="liquid-input"
                        aria-label="Filter by priority">
                        <option value="">All Priority</option>
                        <option value="urgent">Urgent</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>

                    <select id="ticketStatus" name="ticketStatus" class="liquid-input" aria-label="Filter by status">
                        <option value="">All Status</option>
                        <option value="open">Open</option>
                        <option value="in_progress">In progress</option>
                        <option value="awaiting_user">Awaiting reply</option>
                        <option value="resolved">Resolved</option>
                        <option value="closed">Closed</option>
                    </select>

                    <select id="ticketCategory" name="ticketCategory" class="liquid-input"
                        aria-label="Filter by category">
                        <option value="">All Categories</option>
                        <option value="account">Account</option>
                        <option value="payments">Payments</option>
                        <option value="listings">Listings</option>
                        <option value="technical">Technical</option>
                        <option value="reports">Reports</option>
                    </select>

                </form>

                <!-- Table -->

                <div class="table-wrapper">

                    <table class="admin-table">

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Subject</th>
                                <th>User</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="supportTicketsTable"></tbody>

                    </table>

                </div>

                <div id="ticketPagination" class="pagination"></div>

                <!-- Empty State -->

                <div id="noTicketsFound" class="empty-state hidden">

                    <i class="fa-solid fa-inbox" aria-hidden="true"></i>

                    <h3>No Tickets Found</h3>

                    <p>No support ticket matches your current search or filter.</p>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <div id="footer"></div>

    <!-- JavaScript -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

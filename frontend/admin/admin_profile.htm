<!DOCTYPE html>

<html lang="en">

<head>

    <!-- ==========================================
         Basic Meta Information
    =========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Profile | ResiHub</title>

    <meta name="description"
        content="View and manage your administrator profile, account information, security settings and preferences on the ResiHub Administration Portal.">

    <meta name="keywords" content="ResiHub, Admin Profile, Administrator, Settings, Account">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_profile.htm">

    <!-- ==========================================
         Open Graph
    =========================================== -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Admin Profile | ResiHub">

    <meta property="og:description" content="Manage your administrator account and profile information.">

    <meta property="og:url" content="https://www.resihub.com/admin_profile.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Twitter
    =========================================== -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Admin Profile | ResiHub">

    <meta name="twitter:description" content="Manage your administrator profile and account preferences.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Favicon
    =========================================== -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         Fonts & Icons
    =========================================== -->

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ==========================================
         Master Stylesheet
    =========================================== -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body data-resihub-surface="admin">

    <!-- ==========================================
         Scroll Progress Indicator
    =========================================== -->

    <div id="scrollProgress"></div>

    <!-- ==========================================
         Floating Background Shapes
    =========================================== -->

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <!-- ==========================================
         Dynamic Header
    =========================================== -->

    <div id="header"></div>

    <!-- ==========================================
         Main Content
    =========================================== -->

    <main id="mainContent">

        <section id="admin-profile-content" class="page-section">

            <div class="container">

                <!-- Heading -->

                <header class="section-header">
                    <span class="page-badge floating-badge">
                        <i class="fa-solid fa-user-shield" aria-hidden="true"></i> Administrator Profile
                    </span>
                    <h1>Administrator Profile</h1>
                    <p>Manage your account details.</p>
                </header>

                <div class="settings-grid">

                    <!-- Profile summary -->

                    <aside class="profile-card dashboard-card glass-card">

                        <div class="profile-summary">

                            <img id="adminProfileImage" class="profile-avatar" src="../assets/images/default-avatar.png"
                                alt="Your profile photo">

                            <label for="profileImageUpload" class="btn-outline"
                                title="Photo upload is not available yet">
                                <i class="fa-solid fa-camera" aria-hidden="true"></i> Change photo
                            </label>
                            <input type="file" id="profileImageUpload" accept="image/*" hidden>

                            <h2 id="adminName"></h2>
                            <p id="adminRole"></p>

                        </div>

                        <div class="profile-stats">
                            <p><i class="fa-solid fa-calendar-days" aria-hidden="true"></i> Joined <span
                                    id="joinDate"></span></p>
                            <p><i class="fa-solid fa-clock" aria-hidden="true"></i> Last login <span
                                    id="lastLogin"></span></p>
                            <p><i class="fa-solid fa-laptop" aria-hidden="true"></i> Active sessions <span
                                    id="activeSessions"></span></p>
                        </div>

                    </aside>

                    <!-- Account details and password -->

                    <form id="adminProfileForm" class="dashboard-card glass-card profile-form" autocomplete="off">

                        <div class="form-group">
                            <label for="fullName">Full name</label>
                            <input type="text" id="fullName" name="fullName" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email">
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" name="phone">
                        </div>

                        <div class="form-group">
                            <label for="position">Role</label>
                            <input type="text" id="position" name="position">
                        </div>

                        <h3 class="form-subtitle">Change password</h3>

                        <div class="form-group">
                            <label for="currentPassword">Current password</label>
                            <input type="password" id="currentPassword" name="currentPassword"
                                autocomplete="current-password">
                        </div>

                        <div class="form-group">
                            <label for="newPassword">New password</label>
                            <input type="password" id="newPassword" name="newPassword" autocomplete="new-password">
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirm new password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                autocomplete="new-password">
                        </div>

                        <h3 class="form-subtitle">Security</h3>

                        <label class="checkbox-group" title="Not available yet">
                            <input type="checkbox" id="enable2FA" disabled>
                            <span>Two-factor authentication (coming soon)</span>
                        </label>

                        <label class="checkbox-group" title="Not available yet">
                            <input type="checkbox" id="loginNotification" disabled>
                            <span>Email me about new sign-ins (coming soon)</span>
                        </label>

                        <div class="action-buttons">
                            <button type="reset" class="btn-outline">
                                <i class="fa-solid fa-rotate-left" aria-hidden="true"></i> Reset
                            </button>
                            <button type="submit" id="saveProfileBtn" class="btn-primary">
                                <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save changes
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <div id="footer"></div>

    <!-- JavaScript -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

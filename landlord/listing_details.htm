    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main Stylesheet -->

    <link rel="stylesheet" href="../styles/style.css">
    <!-- Structured Data -->

    <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"WebPage",
      "name":"Student Accommodation Listing Details",
      "url":"https://www.resihub.com/room_details.htm",
      "description":"View complete details of student accommodation listings on ResiHub including amenities, landlord information, location, reviews and inspection booking.",
      "publisher":{
        "@type":"Organization",
        "name":"ResiHub",
        "logo":{
          "@type":"ImageObject",
          "url":"https://www.resihub.com/assets/images/logo.png"
        }
      }
    }

</head>

<body>
    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>
    <!-- HEADER / NAVIGATION-->

    <div id="header"></div>

    <main>

        <!-- Listing Gallery -->
        <section class="listing-hero">

            <div class="container">

                <div id="propertyGallery" class="property-gallery" aria-label="Property image gallery">

                </div>

            </div>

        </section>

        <!-- Property Details -->
        <section class="listing-details">

            <div class="container">

                <div class="listing-layout">

                    <!-- Main Property Information -->
                    <article class="listing-main">

                        <header class="listing-header">

                            <h1 id="propertyTitle">
                                Property Title
                            </h1>

                            <p id="propertyLocation">
                                Property Location
                            </p>

                            <h2 id="propertyPrice">
                                â‚¦0
                            </h2>

                            <div id="propertyBadges" class="property-badges" aria-label="Property Highlights">

                            </div>

                        </header>

                        <!-- Description -->
                        <section class="property-description">

                            <h2>Description</h2>

                            <p id="propertyDescription">

                            </p>

                        </section>

                        <!-- Quick Facts -->
                        <section class="quick-facts">

                            <h2>Property Details</h2>

                            <div class="facts-grid">

                                <div class="fact-card">

                                    <i class="fa-solid fa-bed" aria-hidden="true"></i>

                                    <span id="bedroomCount"></span>

                                </div>

                                <div class="fact-card">

                                    <i class="fa-solid fa-bath" aria-hidden="true"></i>

                                    <span id="bathroomCount"></span>

                                </div>

                                <div class="fact-card">

                                    <i class="fa-solid fa-ruler-combined" aria-hidden="true"></i>

                                    <span id="propertySize"></span>

                                </div>

                                <div class="fact-card">

                                    <i class="fa-solid fa-building" aria-hidden="true"></i>

                                    <span id="propertyType"></span>

                                </div>

                            </div>

                        </section>

                        <!-- Amenities -->
                        <section class="property-amenities">

                            <h2>Amenities</h2>

                            <div id="amenitiesGrid" class="amenities-grid">

                            </div>

                        </section>

                        <!-- Features -->
                        <section class="property-features">

                            <h2>Features</h2>

                            <div id="featuresGrid" class="features-grid">

                            </div>

                        </section>

                        <!-- Map -->
                        <section class="property-map">

                            <h2>Property Location</h2>

                            <div id="propertyMap" aria-label="Property Map">

                            </div>

                        </section>

                        <!-- Reviews -->
                        <section class="property-reviews">

                            <div class="section-header">

                                <h2>Student Reviews</h2>

                            </div>

                            <div id="reviewList" class="review-list">

                            </div>

                        </section>

                        <!-- Similar Listings -->
                        <section class="similar-properties">

                            <div class="section-header">

                                <h2>Similar Properties</h2>

                            </div>

                            <div id="similarListings" class="listing-grid">

                            </div>

                        </section>

                    </article>

                    <!-- Sidebar -->
                    <aside class="listing-sidebar">

                        <div class="landlord-card">

                            <img id="landlordPhoto" src="../assets/images/default-avatar.png"
                                alt="Landlord Profile Picture">

                            <h3 id="landlordName">

                            </h3>

                            <p id="landlordJoined">

                            </p>

                            <button id="chatLandlordBtn" class="btn-primary" type="button"
                                aria-label="Chat with Landlord">

                                <i class="fa-solid fa-comments" aria-hidden="true"></i>

                                Chat

                            </button>

                            <button id="inspectionBtn" class="btn-primary magnetic-btn ripple-btn shine-btn"
                                type="button" aria-label="Book Property Inspection">

                                Book Inspection

                            </button>

                        </div>

                    </aside>

                </div>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <div id="footer"></div>

    <!-- Page Script -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Listing | List Student Accommodation in Nigeria | ResiHub</title>

  <meta name="description"
    content="Create and publish verified student accommodation listings on ResiHub. Upload hostel, apartment or self-contained properties near universities across Nigeria.">

  <meta name="keywords"
    content="ResiHub, create listing, landlord, student accommodation Nigeria, hostel listing, apartment listing, property upload">

  <meta name="author" content="ResiHub">

  <meta name="robots" content="index, follow">

  <link rel="canonical" href="https://www.resihub.com/create_listing.htm">

  <link rel="icon" type="image/png" href="../assets/images/favicon.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <link rel="stylesheet" href="../styles/style.css">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Create Listing | ResiHub">
  <meta property="og:description"
    content="Publish your student accommodation listing and connect with thousands of students across Nigeria.">
  <meta property="og:image" content="../assets/images/og-image.jpg">
  <meta property="og:url" content="https://www.resihub.com/create_listing.htm">
  <meta property="og:site_name" content="ResiHub">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Create Listing | ResiHub">
  <meta name="twitter:description" content="Create and publish your student accommodation listing on ResiHub.">
  <meta name="twitter:image" content="../assets/images/og-image.jpg">
</head>

<body>
  <div id="scrollProgress"></div>

  <div class="floating-shapes" aria-hidden="true">

    <span class="shape shape-1"></span>

    <span class="shape shape-2"></span>

    <span class="shape shape-3"></span>

    <span class="shape shape-4"></span>

  </div>
  <!-- HEADER / NAVIGATION-->

  <div id="header"></div>

  <main>
    <section id="create-listing-hero" class="auth-hero reveal fade-up">

      <div class="container">

        <div class="page-hero-content hero-content">


          <span class="page-badge floating-badge">
            <i class="fa-solid fa-house-circle-plus" aria-hidden="true"></i>
            New Listing
          </span>

          <h1 class="hero-title">
            Create Property Listing
          </h1>

          <p class="hero-description">
            Fill in your property details and publish it for thousands of students to discover.
          </p>
        </div>

      </div>

    </section>
    <section class="listing-form-section">
      <div class="container">

        <form id="createListingForm" autocomplete="off">

          <div class="form-card">

            <h2>Basic Information</h2>

            <div class="form-grid">

              <div class="form-group">
                <label for="propertyTitle">Property Title</label>
                <input type="text" id="propertyTitle" name="title" required>
              </div>

              <div class="form-group">
                <label for="propertyType">Property Type</label>
                <select id="propertyType" name="propertyType" required>
                  <option value="">Select</option>
                  <option>Hostel</option>
                  <option>Self Contain</option>
                  <option>Single Room</option>
                  <option>Shared Room</option>
                  <option>Apartment</option>
                </select>
              </div>

              <div class="form-group">
                <label for="propertyPrice">Annual Rent (â‚¦)</label>
                <input type="number" id="propertyPrice" name="price">
              </div>

              <div class="form-group">
                <label for="availableRooms">Available Rooms</label>
                <input type="number" id="availableRooms" name="rooms">
              </div>

            </div>

          </div>

      </div>
      <div class="form-card">

        <h2>Location</h2>

        <div class="form-grid">

          <div class="form-group">
            <label for="propertyUniversity">Nearest University</label>
            <input id="propertyUniversity" name="university" type="text" placeholder="Nearest University" required>
          </div>

          <div class="form-group">
            <label for="propertyArea">Area</label>
            <input id="propertyArea" name="area" type="text" placeholder="Area" required>
          </div>

          <div class="form-group">
            <label for="propertyAddress">Address</label>
            <input id="propertyAddress" name="address" type="text" placeholder="Full Address">
          </div>

        </div>

      </div>
      <div class="form-card">

        <h2>Description</h2>

        <label for="propertyDescription">
          Property Description
        </label>

        <textarea id="propertyDescription" name="description" rows="6" placeholder="Describe your property..."
          required></textarea>

      </div>
      <div class="form-card">

        <h2>Amenities</h2>

        <div class="amenities-grid">

          <label class="checkbox-item">
            <input type="checkbox" id="wifiAmenity" name="amenities" value="wifi">
            Wi-Fi
          </label>

          <label class="checkbox-item">
            <input type="checkbox" id="waterAmenity" name="amenities" value="water">
            Running Water
          </label>

          <label class="checkbox-item">
            <input type="checkbox" id="electricityAmenity" name="amenities" value="electricity">
            Stable Electricity
          </label>

          <label class="checkbox-item">
            <input type="checkbox" id="securityAmenity" name="amenities" value="security">
            Security
          </label>

          <label class="checkbox-item">
            <input type="checkbox" id="parkingAmenity" name="amenities" value="parking">
            Parking
          </label>

          <label class="checkbox-item">
            <input type="checkbox" id="kitchenAmenity" name="amenities" value="kitchen">
            Kitchen
          </label>

          <label class="checkbox-item">
            <input type="checkbox" id="bathroomAmenity" name="amenities" value="bathroom">
            Private Bathroom
          </label>

          <label class="checkbox-item">
            <input type="checkbox" id="furnishedAmenity" name="amenities" value="furnished">
            Furnished
          </label>

        </div>

      </div>

      </div>
      <div class="form-card">

        <h2>Property Images</h2>

        <div id="imageUploadZone" class="upload-zone">
          <label for="propertyImages">
            Upload Images <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
          </label>

          <p>

            Drag & Drop images here

          </p>

          <label for="propertyImages" class="btn-primary magnetic-btn ripple-btn shine-btn">

            Choose Images

          </label>

          <input type="file" aria-label="Upload Property Images" id="propertyImages" name="images" accept="image/*"
            multiple hidden>

        </div>

        <div id="imagePreview" class="image-preview-grid">

        </div>

      </div>
      <div class="form-card">

        <div class="publish-actions">

          <button type="submit" id="publishListingBtn" class="btn-primary magnetic-btn ripple-btn shine-btn">

            <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>

            Publish Listing

          </button>

          <button type="button" id="saveDraftBtn" class="btn-primary magnetic-btn ripple-btn shine-btn">

            Save Draft

          </button>

        </div>

        </form>

      </div>
    </section>
  </main>
  <!--FOOTER-->

  <div id="footer"></div>

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

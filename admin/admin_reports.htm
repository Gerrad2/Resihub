<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
         Basic Meta Information
    =========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Reports | ResiHub</title>

    <meta name="description"
        content="Review, investigate and resolve reports submitted by students and landlords on the ResiHub platform.">

    <meta name="keywords" content="ResiHub, admin reports, reported listings, complaints, administrator">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_reports.htm">

    <!-- ==========================================
         Open Graph
    =========================================== -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Admin Reports | ResiHub">

    <meta property="og:description"
        content="Manage user reports, complaints and moderation across the ResiHub platform.">

    <meta property="og:url" content="https://www.resihub.com/admin_reports.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Twitter
    =========================================== -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Admin Reports | ResiHub">

    <meta name="twitter:description" content="Administrator report management for the ResiHub platform.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Favicon
    =========================================== -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         Fonts & Icons
    =========================================== -->

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ==========================================
         Master Stylesheet
    =========================================== -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body>

    <!-- ==========================================
         Scroll Progress
    =========================================== -->

    <div id="scrollProgress"></div>

    <!-- ==========================================
         Floating Background Shapes
    =========================================== -->

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <!-- ==========================================
         Dynamic Admin Header
    =========================================== -->

    <div id="header"></div>

    <!-- ==========================================
         Main Content
    =========================================== -->

    <main id="mainContent" class="page-transition">

        <section id="admin-reports-content"
            class="auth-section reveal fade-up page-section glass-reveal floating-section">

            <div class="container page-container">

                <!-- ==========================
                     Page Header
                =========================== -->

                <section id="adminReportsContent" class="page-section">

                    <div class="container page-container">

                        <!-- ==========================================
             Page Header
        =========================================== -->

                        <header class="section-header">

                            <div class="container">

                                <header class="auth-hero reveal fade-up">

                                    <div id="hero-text">

                                        <span class="page-badge floating-badge glass-card">

                                            <i class="fa-solid fa-flag"></i>

                                            Administration

                                        </span>

                                        <h1>Reports Management</h1>

                                        <p>

                                            Review complaints submitted by students and landlords,
                                            investigate reported users or listings,
                                            and take appropriate moderation actions.

                                        </p>

                                </header>

                                <!-- ==========================
                     Statistics
                =========================== -->

                                <section class="dashboard-section statistics-section glass-reveal">

                                    <div class="dashboard-grid statistics-grid">

                                        <article class="dashboard-card statistics-card floating-card glass-card">

                                            <div class="card-icon">

                                                <i class="fa-solid fa-flag"></i>

                                            </div>

                                            <div class="card-content">

                                                <h3 id="totalReports" class="count-up">0</h3>

                                                <p>Total Reports</p>

                                            </div>

                                        </article>

                                        <article class="dashboard-card statistics-card floating-card glass-card">

                                            <div class="card-icon">

                                                <i class="fa-solid fa-hourglass-half"></i>

                                            </div>

                                            <div class="card-content">

                                                <h3 id="pendingReports" class="count-up">0</h3>

                                                <p>Pending</p>

                                            </div>

                                        </article>

                                        <article class="dashboard-card statistics-card floating-card glass-card">

                                            <div class="card-icon">

                                                <i class="fa-solid fa-circle-check"></i>

                                            </div>

                                            <div class="card-content">

                                                <h3 id="resolvedReports" class="count-up">0</h3>

                                                <p>Resolved</p>

                                            </div>

                                        </article>

                                        <article class="dashboard-card statistics-card floating-card glass-card">

                                            <div class="card-icon">

                                                <i class="fa-solid fa-ban"></i>

                                            </div>

                                            <div class="card-content">

                                                <h3 id="suspendedAccounts" class="count-up">0</h3>

                                                <p>Suspended Accounts</p>

                                            </div>

                                        </article>

                                    </div>

                                </section>

                                <!-- ==========================
                     Search & Filters
                =========================== -->

                                <section class="filter-section glass-card">

                                    <form id="reportFilterForm" class="filter-form liquid-form" role="search"
                                        aria-label="Filter Reports">

                                        <div class="liquid-group">

                                            <label class="visually-hidden" for="reportSearch">

                                                Search Reports

                                            </label>

                                            <input type="search" id="reportSearch" name="reportSearch"
                                                class="liquid-input"
                                                placeholder="Search by user, listing or report ID..."
                                                autocomplete="off">

                                        </div>

                                        <div class="liquid-group">

                                            <select id="reportStatus" name="reportStatus" class="liquid-input">

                                                <option value="">All Statuses</option>
                                                <option value="Pending">Pending</option>
                                                <option value="Investigating">Investigating</option>
                                                <option value="Resolved">Resolved</option>
                                                <option value="Dismissed">Dismissed</option>

                                            </select>

                                        </div>

                                        <div class="liquid-group">

                                            <select id="reportType" name="reportType" class="liquid-input">

                                                <option value="">All Report Types</option>
                                                <option value="Listing">Listing</option>
                                                <option value="Landlord">Landlord</option>
                                                <option value="Student">Student</option>
                                                <option value="Payment">Payment</option>
                                                <option value="Spam">Spam</option>
                                                <option value="Fraud">Fraud</option>

                                            </select>

                                        </div>

                                        <div class="liquid-group">

                                            <select id="reportPriority" name="reportPriority" class="liquid-input">

                                                <option value="">All Priorities</option>
                                                <option value="Low">Low</option>
                                                <option value="Medium">Medium</option>
                                                <option value="High">High</option>
                                                <option value="Critical">Critical</option>

                                            </select>

                                        </div>

                                    </form>

                                </section>

                                <!-- ==========================
                     Reports Grid
                =========================== -->

                                <section class="dashboard-section glass-reveal">

                                    <div id="reportsGrid" class="reports-grid" aria-live="polite">

                                        <!-- Reports loaded dynamically -->

                                    </div>

                                </section>

                                <!-- ==========================
                     Report Details
                =========================== -->

                                <section id="reportDetails" class="dashboard-section details-card glass-card hidden">

                                    <header class="section-header">

                                        <h2>Report Details</h2>

                                    </header>

                                    <div id="reportInformation">

                                        <!-- Dynamic Content -->

                                    </div>

                                </section>

                                <!-- ==========================
                     Moderator Notes
                =========================== -->

                                <section class="dashboard-section details-card glass-card">

                                    <header class="section-header">

                                        <h2>Moderator Notes</h2>

                                    </header>

                                    <textarea id="moderatorNotes" class="liquid-input" rows="6"
                                        placeholder="Enter investigation notes..."></textarea>

                                </section>

                                <!-- ==========================
                     Admin Actions
                =========================== -->

                                <div class="action-buttons">

                                    <button id="investigateBtn" class="btn btn-primary azure-sweep ripple">

                                        <i class="fa-solid fa-magnifying-glass"></i>

                                        <span>Investigate</span>

                                    </button>

                                    <button id="resolveBtn" class="btn btn-primary azure-sweep ripple">

                                        <i class="fa-solid fa-circle-check"></i>

                                        <span>Mark Resolved</span>

                                    </button>

                                    <button id="dismissBtn" class="btn btn-outline">

                                        <i class="fa-solid fa-xmark"></i>

                                        <span>Dismiss Report</span>

                                    </button>

                                    <button id="suspendUserBtn" class="btn btn-danger">

                                        <i class="fa-solid fa-user-slash"></i>

                                        <span>Suspend User</span>

                                    </button>

                                    <button id="removeListingBtn" class="btn btn-danger">

                                        <i class="fa-solid fa-trash"></i>

                                        <span>Remove Listing</span>

                                    </button>

                                </div>

                            </div>

                </section>

    </main>
    <!-- ==========================================
         Dynamic Footer
    =========================================== -->

    <div id="footer"></div>

    <!-- ==========================================
         JavaScript
    =========================================== -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>

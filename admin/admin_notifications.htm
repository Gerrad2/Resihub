<head>

    <!-- ==========================================
         Basic Meta Information
    =========================================== -->

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Notifications | ResiHub</title>

    <meta name="description"
        content="View and manage system notifications, alerts and announcements for the ResiHub administration panel.">

    <meta name="keywords" content="ResiHub, Admin, Notifications, Alerts, Messages">

    <meta name="author" content="ResiHub">

    <meta name="robots" content="noindex, nofollow">

    <link rel="canonical" href="https://www.resihub.com/admin_notifications.htm">

    <!-- ==========================================
         Open Graph
    =========================================== -->

    <meta property="og:type" content="website">

    <meta property="og:title" content="Admin Notifications | ResiHub">

    <meta property="og:description" content="Manage platform notifications and announcements.">

    <meta property="og:url" content="https://www.resihub.com/admin_notifications.htm">

    <meta property="og:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Twitter Card
    =========================================== -->

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Admin Notifications | ResiHub">

    <meta name="twitter:description" content="Manage platform notifications and announcements.">

    <meta name="twitter:image" content="https://www.resihub.com/assets/images/og-image.jpg">

    <!-- ==========================================
         Favicon
    =========================================== -->

    <link rel="icon" type="image/png" href="../assets/images/favicon.png">

    <!-- ==========================================
         Fonts & Icons
    =========================================== -->

    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ==========================================
         Master Stylesheet
    =========================================== -->

    <link rel="stylesheet" href="../styles/style.css">

</head>

<body>

    <div id="scrollProgress"></div>

    <div class="floating-shapes" aria-hidden="true">

        <span class="shape shape-1"></span>

        <span class="shape shape-2"></span>

        <span class="shape shape-3"></span>

        <span class="shape shape-4"></span>

    </div>

    <div id="header"></div>

    <main id="mainContent" class="page-transition">

        <section id="adminNotificationsContent" class="page-section ">

            <div class="container page-container">

                <header class="section-header">

                    <div class="container">

                        <header class="auth-hero reveal fade-up">

                            <div id="hero-text">

                                <span class="page-badge floating-badge glass-card">

                                    <i class="fa-solid fa-bell"></i>

                                    Notifications

                                </span>

                                <h1>Notification Management</h1>

                                <p>

                                    Send announcements, monitor system alerts and manage notifications delivered to
                                    students,
                                    landlords and administrators.

                                </p>

                        </header>

                        <!-- Statistics -->

                        <section class="dashboard-section statistics-section glass-reveal">

                            <div class="dashboard-grid statistics-grid">

                                <article class="dashboard-card statistics-card floating-card glass-card">

                                    <div class="card-icon">

                                        <i class="fa-solid fa-paper-plane"></i>

                                    </div>

                                    <div class="card-content">

                                        <h3 id="totalNotifications" class="count-up">0</h3>

                                        <p>Total Notifications</p>

                                    </div>

                                </article>

                                <article class="dashboard-card statistics-card floating-card glass-card">

                                    <div class="card-icon">

                                        <i class="fa-solid fa-envelope-open-text"></i>

                                    </div>

                                    <div class="card-content">

                                        <h3 id="deliveredNotifications" class="count-up">0</h3>

                                        <p>Delivered</p>

                                    </div>

                                </article>

                                <article class="dashboard-card statistics-card floating-card glass-card">

                                    <div class="card-icon">

                                        <i class="fa-solid fa-clock"></i>

                                    </div>

                                    <div class="card-content">

                                        <h3 id="scheduledNotifications" class="count-up">0</h3>

                                        <p>Scheduled</p>

                                    </div>

                                </article>

                                <article class="dashboard-card statistics-card floating-card glass-card">

                                    <div class="card-icon">

                                        <i class="fa-solid fa-triangle-exclamation"></i>

                                    </div>

                                    <div class="card-content">

                                        <h3 id="systemAlerts" class="count-up">0</h3>

                                        <p>System Alerts</p>

                                    </div>

                                </article>

                            </div>

                        </section>

                        <!-- Notification Form -->

                        <section class="dashboard-section glass-card">

                            <header class="section-header">

                                <h2>Create Notification</h2>

                            </header>

                            <form id="notificationForm" class="filter-form liquid-form">

                                <div class="liquid-group">

                                    <label for="notificationTitle">Title</label>

                                    <input type="text" id="notificationTitle" class="liquid-input"
                                        placeholder="Notification title" required>

                                </div>

                                <div class="liquid-group">

                                    <label for="notificationAudience">Audience</label>

                                    <select id="notificationAudience" class="liquid-input">

                                        <option value="all">Everyone</option>
                                        <option value="students">Students</option>
                                        <option value="landlords">Landlords</option>
                                        <option value="admins">Administrators</option>

                                    </select>

                                </div>

                                <div class="liquid-group">

                                    <label for="notificationPriority">Priority</label>

                                    <select id="notificationPriority" class="liquid-input">

                                        <option value="normal">Normal</option>
                                        <option value="important">Important</option>
                                        <option value="critical">Critical</option>

                                    </select>

                                </div>

                                <div class="liquid-group">

                                    <label for="notificationMessage">Message</label>

                                    <textarea id="notificationMessage" class="liquid-input" rows="6"
                                        placeholder="Write your notification here..." required></textarea>

                                </div>

                                <div class="form-actions">

                                    <button type="submit" id="sendNotificationBtn"
                                        class="btn btn-primary azure-sweep ripple">

                                        <i class="fa-solid fa-paper-plane"></i>

                                        <span>Send Notification</span>

                                    </button>

                                    <button type="button" id="scheduleNotificationBtn" class="btn btn-outline">

                                        <i class="fa-solid fa-calendar-days"></i>

                                        <span>Schedule</span>

                                    </button>

                                    <button type="reset" class="btn btn-outline">

                                        <i class="fa-solid fa-rotate-left"></i>

                                        <span>Clear</span>

                                    </button>

                                </div>

                            </form>

                        </section>

                        <!-- Notification History -->

                        <section class="dashboard-section glass-card">

                            <header class="section-header">

                                <h2>Notification History</h2>

                            </header>

                            <form id="notificationSearchForm" class="filter-form liquid-form" role="search">

                                <div class="liquid-group">

                                    <input type="search" id="notificationSearch" class="liquid-input"
                                        placeholder="Search notifications...">

                                </div>

                                <div class="liquid-group">

                                    <select id="notificationStatus" class="liquid-input">

                                        <option value="">All Status</option>
                                        <option value="sent">Sent</option>
                                        <option value="scheduled">Scheduled</option>
                                        <option value="draft">Draft</option>

                                    </select>

                                </div>

                            </form>

                            <div id="notificationHistory" class="notification-grid"></div>

                        </section>

                        <!-- System Alerts -->

                        <section class="dashboard-section glass-card">

                            <header class="section-header">

                                <h2>Recent System Alerts</h2>

                            </header>

                            <div id="systemAlertList" class="activity-list"></div>

                        </section>

                    </div>

        </section>

    </main>
    <!-- ==========================================
         Footer
    =========================================== -->

    <div id="footer"></div>

    <!-- ==========================================
         JavaScript Files
    =========================================== -->

    <script type="module" src="../js/core/app.js"></script>
</body>

</html>
